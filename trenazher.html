<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Алгебра 7: тренажёр</title>
<style>
  :root {
    --bg: #f6f7fb; --card: #fff; --ink: #1d2433; --muted: #6b7385;
    --accent: #3f6ad8; --accent-soft: #e6ecfb; --ok: #2e8b57; --ok-soft: #e3f4ea;
    --bad: #c0392b; --bad-soft: #fbe9e7; --warn: #c9822b; --warn-soft: #fdf3e4; --line: #d8dce6;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 18px/1.5 "Segoe UI", system-ui, sans-serif; }
  main { max-width: 820px; margin: 0 auto; padding: 24px 16px 80px; }
  h1 { font-size: 28px; margin: 8px 0 4px; }
  h2 { font-size: 22px; margin: 0 0 8px; }
  h3 { font-size: 19px; margin: 16px 0 6px; }
  .muted { color: var(--muted); }
  .card { background: var(--card); border-radius: 14px; padding: 22px 24px;
          box-shadow: 0 1px 3px rgba(0,0,0,.08); margin: 16px 0; }
  .mods { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
  .mod-btn { text-align: left; border: 2px solid var(--line); background: var(--card); border-radius: 12px;
             padding: 14px 16px; cursor: pointer; font: inherit; color: inherit; }
  .mod-btn:hover { border-color: var(--accent); }
  .mod-btn b { display: block; font-size: 18px; }
  .mod-btn small { color: var(--muted); display: block; margin-top: 4px; }
  .mod-btn.mix { border-color: var(--accent); background: var(--accent-soft); }
  .badge { display: inline-block; font-size: 13px; padding: 2px 8px; border-radius: 99px;
           background: var(--accent-soft); color: var(--accent); margin-top: 6px; }
  .badge.done { background: var(--ok-soft); color: var(--ok); }
  button.main { background: var(--accent); color: #fff; border: 0; border-radius: 10px;
                padding: 11px 20px; font: inherit; cursor: pointer; }
  button.ghost { background: transparent; color: var(--accent); border: 2px solid var(--accent);
                 border-radius: 10px; padding: 9px 16px; font: inherit; cursor: pointer; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 16px; }
  .between { justify-content: space-between; }
  .q { font-size: 24px; margin: 10px 0 14px; }
  .step { margin: 12px 0; }
  .step-lbl { font-size: 16px; color: var(--muted); margin-bottom: 4px; }
  input[type=text] { font: inherit; padding: 7px 10px; border: 2px solid var(--line); border-radius: 8px; width: 200px; }
  input[type=text]:focus { outline: none; border-color: var(--accent); }
  .choices { display: flex; gap: 8px; flex-wrap: wrap; }
  .choices label { border: 2px solid var(--line); border-radius: 99px; padding: 5px 14px; cursor: pointer; font-size: 16px; }
  .choices input { display: none; }
  .choices label:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); font-weight: 600; }
  .msg { margin-top: 16px; padding: 12px 16px; border-radius: 10px; font-size: 17px; border-left: 4px solid; }
  .msg.ok { background: var(--ok-soft); border-color: var(--ok); }
  .msg.bad { background: var(--bad-soft); border-color: var(--bad); }
  .msg.warn { background: var(--warn-soft); border-color: var(--warn); }
  .msg.info { background: var(--accent-soft); border-color: var(--accent); }
  .solution { margin-top: 10px; padding: 12px 16px; background: #f9fafc; border-radius: 10px; border: 1px dashed var(--line); }
  .stats { display: flex; gap: 18px; flex-wrap: wrap; font-size: 15px; color: var(--muted); }
  .stats b { color: var(--ink); }
  .streak { display: flex; gap: 4px; margin-top: 6px; }
  .streak span { width: 18px; height: 18px; border-radius: 50%; background: var(--line); }
  .streak span.on { background: var(--ok); }
  .fr { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center;
        font-size: .85em; margin: 0 2px; line-height: 1.15; }
  .fr > span:first-child { border-bottom: 1.5px solid currentColor; padding: 0 3px; }
  .fr > span:last-child { padding: 0 3px; }
  details { margin: 10px 0; }
  details summary { cursor: pointer; color: var(--accent); font-weight: 600; }
  .theory ul { margin: 6px 0; padding-left: 22px; }
  .theory li { margin: 4px 0; }
  .oops { background: var(--warn-soft); border-radius: 10px; padding: 10px 14px; margin: 10px 0; }
  table.t { border-collapse: collapse; margin: 8px 0; font-size: 16px; }
  table.t td, table.t th { border: 1.5px solid var(--line); padding: 5px 10px; }
  svg { max-width: 100%; height: auto; display: block; margin: 8px 0; }
  textarea { font: inherit; font-size: 14px; width: 100%; min-height: 220px; padding: 8px; border: 2px solid var(--line); border-radius: 8px; }
</style>
</head>
<body>
<main id="app"></main>

<script>
"use strict";

// ---------- numbers ----------
const ri = (lo, hi) => lo + Math.floor(Math.random() * (hi - lo + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const round6 = x => Math.round(x * 1e6) / 1e6;
const eq = (a, b) => Math.abs(a - b) < 1e-9;
const fmt = x => String(round6(x)).replace('-', '−').replace('.', ',');
const par = x => x < 0 ? `(${fmt(x)})` : fmt(x);
const fr = (a, b) => `<span class="fr"><span>${a}</span><span>${b}</span></span>`;
const decimals = x => { const s = String(round6(x)); return s.includes('.') ? s.split('.')[1].length : 0; };

// Accepts "-5", "−5", "0,06", "0.06", "5/2", "2 1/2". Returns {value, form} or null.
function parse(str) {
  const s = String(str || '').trim().replace(/[−–—]/g, '-').replace(/,/g, '.').replace(/\s+/g, ' ');
  let m;
  if ((m = s.match(/^(-?)(\d+) (\d+)\/(\d+)$/))) {
    const v = +m[2] + +m[3] / +m[4];
    return +m[4] === 0 ? null : { value: m[1] ? -v : v, form: 'mixed' };
  }
  if ((m = s.match(/^(-?\d+(?:\.\d+)?)\/(\d+(?:\.\d+)?)$/)))
    return +m[2] === 0 ? null : { value: +m[1] / +m[2], form: 'fraction', num: +m[1], den: +m[2] };
  if (/^-?\d+(\.\d+)?$/.test(s)) return { value: +s, form: 'number' };
  return null;
}
const signWord = x => x > 0 ? 'положительный' : x < 0 ? 'отрицательный' : 'ноль';

// Number line with an arrow from `from` to `to`.
function numberLine(from, to, label) {
  const lo = Math.min(0, from, to) - 1, hi = Math.max(0, from, to) + 1;
  const W = 600, pad = 30, k = (W - 2 * pad) / (hi - lo), X = v => pad + (v - lo) * k;
  const every = hi - lo > 30 ? 5 : 1;
  let s = `<svg viewBox="0 0 ${W} 90" width="${W}" height="90" xmlns="http://www.w3.org/2000/svg">
    <defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker></defs>
    <line x1="10" y1="60" x2="${W - 10}" y2="60" stroke="#333" stroke-width="1.5"/>`;
  for (let v = Math.ceil(lo); v <= hi; v++) {
    const major = v % every === 0 || v === from || v === to || v === 0;
    if (!major && every > 1) continue;
    s += `<line x1="${X(v)}" y1="55" x2="${X(v)}" y2="65" stroke="#333"/>`;
    if (v % every === 0 || v === from || v === to)
      s += `<text x="${X(v)}" y="84" font-size="13" text-anchor="middle" ${v === 0 ? 'font-weight="700"' : ''}>${fmt(v)}</text>`;
  }
  const mid = (X(from) + X(to)) / 2;
  s += `<path d="M${X(from)},55 Q${mid},10 ${X(to)},55" fill="none" stroke="#c0392b" stroke-width="2.5" marker-end="url(#ar)"/>`;
  s += `<circle cx="${X(from)}" cy="60" r="5" fill="#3f6ad8"/><circle cx="${X(to)}" cy="60" r="5" fill="#c0392b"/>`;
  s += `<text x="${mid}" y="22" font-size="15" text-anchor="middle" fill="#c0392b" font-weight="700">${label}</text>`;
  return s + '</svg>';
}

// ---------- task generators ----------
// A task: { q, answer, form?, predict?: {label, options, correct}, check?: {label, target},
//           scaffold?: {label, answer, hint}, diagnose(value, parsed) -> string|null, solution: html }

function genNeg() {
  let a, b, op;
  do { a = ri(-15, 15); b = ri(-15, 15); op = pick(['+', '−']); }
  while (a === 0 || b === 0 || (a > 0 && b > 0) || (op === '+' && a + b === 0));
  const ans = op === '+' ? a + b : a - b;
  const asAdd = op === '+' ? b : -b;   // subtraction rewritten as addition of the opposite
  const sameSign = Math.sign(a) === Math.sign(asAdd);
  let sol = op === '−' ? `<p>Вычесть число — значит прибавить противоположное:<br>
      ${fmt(a)} − ${par(b)} = ${fmt(a)} + ${par(asAdd)}</p>` : '';
  sol += sameSign
    ? `<p>Знаки одинаковые: модули складываем (${Math.abs(a)} + ${Math.abs(asAdd)} = ${Math.abs(ans)}), знак общий: <b>${fmt(ans)}</b>.</p>`
    : `<p>Знаки разные: из большего модуля вычитаем меньший (${Math.max(Math.abs(a), Math.abs(asAdd))} − ${Math.min(Math.abs(a), Math.abs(asAdd))} = ${Math.abs(ans)}),
       знак — того числа, чей модуль больше: <b>${fmt(ans)}</b>.</p>`;
  sol += numberLine(a, ans, (asAdd > 0 ? '+' : '') + fmt(asAdd));
  sol += `<p class="muted">От ${fmt(a)} сдвигаемся на ${Math.abs(asAdd)} ${asAdd > 0 ? 'вправо' : 'влево'}.</p>`;
  return {
    q: `${fmt(a)} ${op} ${par(b)}`, answer: ans, expr: true,
    predict: { label: 'Сначала прикинь: какой будет знак у ответа?', options: ['положительный', 'отрицательный', 'ноль'], correct: signWord(ans) },
    diagnose(v) {
      if (eq(v, -ans)) return 'Число верное, а знак — нет. Нарисуй на прямой: откуда стартуешь и куда идёшь.';
      if (!sameSign && eq(Math.abs(v), Math.abs(a) + Math.abs(asAdd)))
        return 'Знаки разные — модули не складывают, а вычитают. Долг и деньги «гасят» друг друга.';
      if (op === '−' && b < 0 && eq(v, a + b)) return `Минус перед скобкой меняет знак числа в скобке: − ${par(b)} = + ${fmt(-b)}.`;
      if (op === '−' && b > 0 && eq(v, a + b)) return `Вычитать положительное — значит идти влево: ${fmt(a)} − ${b} = ${fmt(a)} + (−${b}).`;
      return 'Перепиши вычитание как сложение с противоположным числом и представь числовую прямую.';
    },
    solution: sol
  };
}

function genPow() {
  const a = ri(2, 6);
  const form = pick(['sq', 'negsq', 'cube', 'sq', 'negsq']);
  const exp = form === 'cube' ? (a > 4 ? 2 : 3) : 2;
  const q = form === 'negsq' ? `−${a}<sup>2</sup>` : `(−${a})<sup>${exp}</sup>`;
  const ans = form === 'negsq' ? -(a * a) : Math.pow(-a, exp);
  const sol = form === 'negsq'
    ? `<p>Скобок нет — степень относится только к ${a}, а минус стоит перед результатом:<br>−${a}<sup>2</sup> = −(${a} · ${a}) = <b>${fmt(ans)}</b>.</p>`
    : `<p>Минус в скобках — он тоже возводится в степень:<br>(−${a})<sup>${exp}</sup> = ${Array(exp).fill(`(−${a})`).join(' · ')} = <b>${fmt(ans)}</b>.</p>
       <p class="muted">${exp % 2 ? 'Нечётное' : 'Чётное'} число минусов — ответ ${exp % 2 ? 'отрицательный' : 'положительный'}.</p>`;
  return {
    q, answer: ans, expr: true,
    predict: { label: 'Какой будет знак?', options: ['положительный', 'отрицательный'], correct: signWord(ans) },
    diagnose(v) {
      if (eq(Math.abs(v), a * exp) && a * exp !== Math.abs(ans)) return `Степень — это не умножение на показатель: ${a}<sup>${exp}</sup> = ${Array(exp).fill(a).join(' · ')}, а не ${a} · ${exp}.`;
      if (eq(v, -ans) && form === 'negsq') return 'Посмотри, есть ли скобки. Без скобок в квадрат возводится только число, а минус остаётся снаружи.';
      if (eq(v, -ans)) return `Распиши как умножение: ${Array(exp).fill(`(−${a})`).join(' · ')}. Минус на минус — плюс. Ты ведь знаешь, что (−4) · (−6) = 24 — здесь то же самое.`;
      return 'Распиши степень как умножение одинаковых множителей.';
    },
    solution: sol
  };
}

function genDecMul() {
  const x = pick([ri(1, 9) / 10, ri(11, 39) / 10, ri(1, 9) / 100]);
  const y = pick([ri(2, 9) / 10, ri(2, 9), ri(11, 25) / 10]);
  const ans = round6(x * y);
  const dx = decimals(x), dy = decimals(y);
  const ix = Math.round(x * 10 ** dx), iy = Math.round(y * 10 ** dy);
  return {
    q: `${fmt(x)} · ${fmt(y)}`, answer: ans,
    expr: true,
    predict: { label: `Ответ будет больше или меньше, чем ${fmt(x)}?`, options: ['больше', 'меньше'], correct: y > 1 ? 'больше' : 'меньше', ref: x },
    diagnose(v) {
      for (const k of [10, 100, 1000]) if (eq(v * k, ans) || eq(v / k, ans))
        return `Цифры верные, а запятая не на месте. Знаков после запятой у множителей: ${dx} + ${dy} = ${dx + dy}.`;
      return `Перемножь как целые числа (${ix} · ${iy}), потом поставь запятую.`;
    },
    solution: `<p>Перемножаем как целые: ${ix} · ${iy} = ${ix * iy}.</p>
      <p>Знаков после запятой у множителей: ${dx} + ${dy} = ${dx + dy}. Отсчитываем справа ${dx + dy}: <b>${fmt(ans)}</b>.</p>
      <p class="muted">${y < 1 ? `Умножили на число меньше 1 — ответ стал меньше ${fmt(x)}.` : `Умножили на число больше 1 — ответ больше ${fmt(x)}.`}</p>`
  };
}

function genDecDiv() {
  const d = pick([0.2, 0.5, 0.4, 0.06, 0.03, 0.05, 0.25, 1.5, 0.8, 0.12, 0.3, 0.004]);
  const q = pick([ri(2, 60), ri(2, 60), ri(1, 19) + 0.5]);
  const dividend = round6(q * d);
  const k = decimals(d);
  const big = round6(dividend * 10 ** k), small = round6(d * 10 ** k);
  return {
    q: `${fmt(dividend)} : ${fmt(d)}`, answer: q,
    expr: true,
    predict: { label: `Ответ будет больше или меньше, чем ${fmt(dividend)}?`, options: ['больше', 'меньше'], correct: d < 1 ? 'больше' : 'меньше', ref: dividend },
    check: { label: `Проверь умножением: твой ответ · ${fmt(d)} =`, target: dividend, compute: v => round6(v * d) },
    diagnose(v) {
      if (eq(v, round6(dividend * d))) return 'Ты умножил вместо деления. Прикидка это ловит: делим на число меньше 1 — ответ должен стать больше.';
      for (const m of [10, 100, 1000]) if (eq(v * m, q) || eq(v / m, q))
        return `Цифры верные, запятая сдвинута не туда. Двигай запятую в <b>обоих</b> числах на ${k} ${k === 1 ? 'знак' : 'знака'} — столько, сколько знаков у делителя.`;
      return `Сделай делитель целым: сдвинь запятую в обоих числах на ${k} вправо.`;
    },
    solution: `<p>Делитель ${fmt(d)} — у него ${k} ${k === 1 ? 'знак' : 'знака'} после запятой. Сдвигаем запятую в обоих числах на ${k} вправо:</p>
      <p>${fmt(dividend)} : ${fmt(d)} = ${fmt(big)} : ${fmt(small)} = <b>${fmt(q)}</b></p>
      <p>Проверка: ${fmt(q)} · ${fmt(d)} = ${fmt(dividend)} ✓</p>`
  };
}

function genPct() {
  if (Math.random() < 0.7) {
    const p = pick([10, 20, 25, 50, 5, 30, 75, 15, 40, 1]);
    const N = pick([20 * ri(1, 15), 10 * ri(2, 30), 100 * ri(1, 9)]);
    const ans = round6(N * p / 100);
    const base = p === 1 ? 1 : 10;
    const baseVal = round6(N * base / 100);
    return {
      q: `${p}% от ${N}`, answer: ans, expr: true,
      scaffold: { label: `Сначала найди ${base}% от ${N}:`, answer: baseVal,
                  hint: base === 1 ? `1% — это сотая часть: ${N} : 100.` : `10% — это десятая часть: ${N} : 10.` },
      diagnose(v) {
        if (eq(v, 100 / p) || eq(v, round6(N / p))) return `Ты разделил на ${p}. А ${p}% — это ${p} сотых: ${N} : 100 · ${p}.`;
        if (eq(v, N - p) || eq(v, N + p)) return 'Проценты не вычитают и не прибавляют к числу — это доля от него.';
        return base === 10 ? `Используй 10%: это ${fmt(baseVal)}. ${p}% — это ${fmt(p / 10)} раз по 10%.` : `1% — это ${fmt(baseVal)}. А ${p}% — в ${p} раз больше.`;
      },
      solution: `<p>${base}% от ${N} = ${N} : ${100 / base} = ${fmt(baseVal)}.</p>
        <p>${p}% = ${fmt(p / base)} · ${base}% = ${fmt(p / base)} · ${fmt(baseVal)} = <b>${fmt(ans)}</b>.</p>
        <p class="muted">Или сразу: ${N} : 100 · ${p} = ${fmt(ans)}.</p>`
    };
  }
  let b, p, a;
  do { b = pick([20, 40, 50, 80, 200, 25, 60, 300]); p = pick([10, 25, 50, 75, 20, 5, 40, 30]); a = b * p / 100; } while (!Number.isInteger(a));
  return {
    q: `Сколько процентов составляет ${a} от ${b}?`, answer: p,
    diagnose(v) {
      if (eq(v, a / b)) return `${fmt(a / b)} — это доля. Чтобы перевести долю в проценты, умножь на 100.`;
      if (eq(v, b / a)) return 'Делим часть на целое, а не наоборот.';
      return `Какую часть ${a} составляет от ${b}? Раздели ${a} на ${b} и умножь на 100.`;
    },
    solution: `<p>${a} : ${b} = ${fmt(a / b)} — такая доля.</p><p>${fmt(a / b)} · 100 = <b>${p}%</b>.</p>`
  };
}

function genUnknown() {
  const kind = pick(['add', 'subFrom', 'sub', 'mul', 'divBy', 'div']);
  let q, x, rule, leftOf, right;
  if (kind === 'add') { const a = ri(5, 40); x = ri(2, 50); right = x + a; q = `x + ${a} = ${right}`; rule = `Неизвестное слагаемое: сумма минус известное слагаемое. x = ${right} − ${a}`; leftOf = v => v + a; }
  if (kind === 'subFrom') { x = ri(2, 30); right = ri(2, 30); const a = x + right; q = `${a} − x = ${right}`; rule = `Неизвестное вычитаемое: уменьшаемое минус разность. x = ${a} − ${right}`; leftOf = v => a - v; }
  if (kind === 'sub') { const a = ri(3, 30); x = ri(a + 1, a + 40); right = x - a; q = `x − ${a} = ${right}`; rule = `Неизвестное уменьшаемое: разность плюс вычитаемое. x = ${right} + ${a}`; leftOf = v => v - a; }
  if (kind === 'mul') { const a = ri(2, 12); x = ri(2, 12); right = a * x; q = `${a} · x = ${right}`; rule = `Неизвестный множитель: произведение разделить на известный множитель. x = ${right} : ${a}`; leftOf = v => a * v; }
  if (kind === 'divBy') { x = ri(2, 12); right = ri(2, 12); const a = x * right; q = `${a} : x = ${right}`; rule = `Неизвестный делитель: делимое разделить на частное. x = ${a} : ${right}`; leftOf = v => a / v; }
  if (kind === 'div') { const a = ri(2, 9); right = ri(2, 12); x = a * right; q = `x : ${a} = ${right}`; rule = `Неизвестное делимое: частное умножить на делитель. x = ${right} · ${a}`; leftOf = v => v / a; }
  return {
    q, answer: x,
    check: { label: 'Подставь свой x в левую часть. Получилось:', target: right, compute: leftOf },
    diagnose() { return `${rule}. И обязательно подставь ответ — равенство должно стать верным.`; },
    solution: `<p>${rule} = <b>${x}</b>.</p><p>Проверка: ${q.replace('x', x).split('=')[0]}= ${right} ✓</p>`
  };
}

function genMixed() {
  const den = ri(2, 9), num = ri(1, den - 1), w = ri(1, 5);
  if (Math.random() < 0.55) {
    const top = w * den + num;
    return {
      q: `Запиши неправильной дробью: ${w}${fr(num, den)}`, answer: top / den, form: 'fraction',
      formHint: 'Нужна неправильная дробь через косую черту, например 7/4.',
      diagnose(v, p) {
        if (p && p.form === 'fraction' && eq(p.num, w * den)) return `Целую часть ты перевёл верно (${w} = ${w * den}/${den}), но потерял ${fr(num, den)}. Прибавь числитель: ${w * den} + ${num}.`;
        return `${w} целых — это ${w} · ${den} = ${w * den} долей по ${fr(1, den)}. И ещё ${num}.`;
      },
      solution: `<p>${w}${fr(num, den)} = ${fr(`${w} · ${den} + ${num}`, den)} = <b>${top}/${den}</b>.</p>
        <p class="muted">${w} целых — это ${w * den} долей по ${fr(1, den)}, и ещё ${num} — всего ${top}.</p>`
    };
  }
  const top = w * den + num;
  return {
    q: `Выдели целую часть: ${fr(top, den)}`, answer: top / den, form: 'mixed',
    formHint: 'Запиши смешанным числом через пробел, например 1 3/4.',
    diagnose() { return `Сколько раз ${den} помещается в ${top}? Это целая часть. Остаток — новый числитель.`; },
    solution: `<p>${top} : ${den} = ${w} (остаток ${num}).</p><p>${fr(top, den)} = <b>${w} ${num}/${den}</b>.</p>`
  };
}

// ---------- modules ----------
const MODULES = [
  { id: 'neg', title: 'Сложение и вычитание отрицательных', short: 'Отрицательные', gen: genNeg,
    theory: `<ul>
      <li><b>Числовая прямая.</b> Прибавить положительное — шаг вправо. Прибавить отрицательное — шаг влево.</li>
      <li><b>Вычесть — значит прибавить противоположное:</b> 5 − (−3) = 5 + 3; &nbsp; −3 − 5 = −3 + (−5).</li>
      <li><b>Сначала знак, потом число.</b> Знаки одинаковые — модули складываем, знак общий. Разные — из большего модуля вычитаем меньший, знак у того, чей модуль больше.</li>
      <li><b>Деньги:</b> −8 — это долг 8 руб. Добавили ещё долг 5 руб. — долг 13: −8 + (−5) = −13.</li></ul>`,
    oops: [['−8 + (−5) = 13', 'Долг плюс долг — это долг, а не прибыль. Модули сложены верно, но знак должен быть минус: <b>−13</b>.'],
           ['−3 − (−7) = −4', 'Вычесть −7 — значит прибавить 7: −3 + 7 = <b>4</b>. Минус перед скобкой «съедает» минус в скобке.']] },
  { id: 'pow', title: 'Степени отрицательных чисел', short: 'Степени', gen: genPow,
    theory: `<ul>
      <li><b>Степень — это умножение одинаковых множителей:</b> 3<sup>2</sup> = 3 · 3, а не 3 · 2.</li>
      <li><b>(−3)<sup>2</sup> = (−3) · (−3) = 9.</b> Минус в скобках — он тоже в степени.</li>
      <li><b>−3<sup>2</sup> = −(3 · 3) = −9.</b> Скобок нет — в квадрат возводится только 3.</li>
      <li>Чётное число минусов — плюс, нечётное — минус: (−2)<sup>3</sup> = −8.</li></ul>`,
    oops: [['(−3)² = −9', 'Распиши: (−3) · (−3). Минус на минус — плюс: <b>9</b>. Петя ведь знает, что (−4) · (−6) = 24 — это то же самое.']] },
  { id: 'dmul', title: 'Умножение десятичных дробей', short: 'Дес. умножение', gen: genDecMul,
    theory: `<ul>
      <li>Перемножь как целые числа, не глядя на запятые.</li>
      <li>Посчитай, сколько знаков после запятой у обоих множителей <b>вместе</b>, и отсчитай столько справа.</li>
      <li><b>Прикидка:</b> умножение на число меньше 1 <b>уменьшает</b>. 0,3 · 0,2 меньше, чем 0,3.</li></ul>`,
    oops: [['0,3 · 0,2 = 0,6', '3 · 2 = 6, знаков после запятой 1 + 1 = 2, значит <b>0,06</b>. Прикидка: 0,3 · 0,2 должно быть меньше 0,2, а 0,6 больше.']] },
  { id: 'ddiv', title: 'Деление на десятичную дробь', short: 'Дес. деление', gen: genDecDiv,
    theory: `<ul>
      <li><b>Сделай делитель целым:</b> сдвинь запятую вправо в <b>обоих</b> числах на столько знаков, сколько их у делителя.<br>2,4 : 0,06 → 240 : 6 = 40.</li>
      <li><b>Прикидка:</b> делим на число меньше 1 — ответ <b>больше</b> делимого. (Сколько раз 6 копеек помещаются в 2 рубля 40 копеек? Много!)</li>
      <li><b>Проверка умножением:</b> 40 · 0,06 = 2,4 ✓. Если не сошлось — ошибка в ответе.</li></ul>`,
    oops: [['2,4 : 0,06 = 0,144', 'Здесь умножили вместо деления. Прикидка ловит сразу: делим на маленькое число — ответ должен быть больше 2,4, а 0,144 меньше. И проверка: 0,144 · 0,06 ≠ 2,4.']] },
  { id: 'pct', title: 'Проценты', short: 'Проценты', gen: genPct,
    theory: `<ul>
      <li><b>Процент — это сотая часть.</b> 1% от 45 = 45 : 100 = 0,45.</li>
      <li><b>10% — десятая часть:</b> 10% от 45 = 4,5. Тогда 20% = 2 · 4,5 = 9, 30% = 3 · 4,5.</li>
      <li>50% — половина, 25% — четверть, 75% — три четверти.</li>
      <li><b>Сколько процентов a от b:</b> a : b · 100. 15 от 60: 15 : 60 = 0,25 → 25%.</li></ul>`,
    oops: [['20% от 45 = 5', '100 : 20 = 5 — это сколько раз по 20% помещается в целом, а не 20% от 45. 10% от 45 = 4,5, значит 20% = <b>9</b>. Прикидка: 20% меньше четверти, а четверть от 45 — около 11.']] },
  { id: 'unk', title: 'Найди неизвестное и проверь', short: 'Неизвестное', gen: genUnknown,
    theory: `<table class="t"><tr><th>Равенство</th><th>Как найти x</th></tr>
      <tr><td>x + 15 = 42</td><td>x = 42 − 15</td></tr><tr><td>50 − x = 20</td><td>x = 50 − 20</td></tr>
      <tr><td>x − 8 = 12</td><td>x = 12 + 8</td></tr><tr><td>3 · x = 12</td><td>x = 12 : 3</td></tr>
      <tr><td>45 : x = 9</td><td>x = 45 : 9</td></tr><tr><td>x : 4 = 6</td><td>x = 6 · 4</td></tr></table>
      <p><b>Главное:</b> подставь ответ в равенство. Если оно стало верным — ответ правильный. Это работает всегда, даже если забыл правило.</p>`,
    oops: [['45 : x = 9, x = 36', 'Подставим: 45 : 36 — это даже не целое число, точно не 9. Неизвестный делитель = делимое : частное = 45 : 9 = <b>5</b>. Проверка: 45 : 5 = 9 ✓.']] },
  { id: 'mix', title: 'Смешанные числа', short: 'Смешанные', gen: genMixed,
    theory: `<ul>
      <li><b>2${fr(1, 2)} = ${fr('2 · 2 + 1', 2)} = ${fr(5, 2)}.</b> 2 целых — это 4 половинки, и ещё одна — всего 5.</li>
      <li><b>Обратно:</b> ${fr(7, 4)} → 7 : 4 = 1 (остаток 3) → 1${fr(3, 4)}.</li>
      <li>В поле смешанное число пиши <b>через пробел</b>: 1 3/4.</li></ul>`,
    oops: [['2½ = 4/2', '4/2 = 2 — половинка потерялась. 2 · 2 = 4 половинки и ещё 1: <b>5/2</b>.']] },
];
const MIX = { id: 'mix-all', title: 'Перемешка', short: 'Перемешка', size: 10 };

// ---------- storage ----------
const KEY = 'algebra7-trainer-v1';
let store = JSON.parse(localStorage.getItem(KEY) || '{}');
store.stats = store.stats || {};
store.log = store.log || [];
const save = () => localStorage.setItem(KEY, JSON.stringify(store));
const today = () => new Date().toISOString().slice(0, 10);
function st(id) {
  return store.stats[id] || (store.stats[id] = { solved: 0, firstTry: 0, sure: 0, sureWrong: 0, selfCaught: 0, streak: 0, mastered: [] });
}

const app = document.getElementById('app');
let session = null; // { mod, task, tries, conf, caught, mixLeft, mixDone, mixRight }

// ---------- screens ----------
function home() {
  session = null;
  const all = Object.values(store.stats);
  const sure = all.reduce((s, x) => s + x.sure, 0), sureWrong = all.reduce((s, x) => s + x.sureWrong, 0);
  const caught = all.reduce((s, x) => s + x.selfCaught, 0);
  app.innerHTML = `
    <h1>Тренажёр</h1>
    <p class="muted">Алгебра, 7 класс · по итогам диагностики</p>
    <div class="card">
      <h2>Как заниматься</h2>
      <ul>
        <li><b>15–20 минут в день.</b> Одна тема — пока не будет <b>5 верных подряд</b>, потом «Перемешка».</li>
        <li><b>Прикидывай до того, как считать.</b> Тренажёр спросит: какой будет знак, больше или меньше. Это главный навык — так ловят свои ошибки.</li>
        <li><b>Проверяй.</b> Где просят проверку — сделай её честно. Если не сошлось, ты <b>сам поймал ошибку</b> — это засчитывается как победа.</li>
        <li>Перед отправкой отметь, уверен ли ты. Цель — чтобы «уверен» почти всегда значило «верно».</li>
      </ul>
      ${sure ? `<p class="stats"><span>Уверен и верно: <b>${sure - sureWrong} из ${sure}</b></span>
                <span>Сам поймал ошибок: <b>${caught}</b></span></p>` : ''}
    </div>
    <div class="mods">
      ${MODULES.map(m => {
        const s = st(m.id), done = s.mastered.includes(today());
        return `<button class="mod-btn" data-mod="${m.id}"><b>${m.title}</b>
          <small>решено ${s.solved}, верно с первой попытки ${s.firstTry}</small>
          <span class="badge${done ? ' done' : ''}">${done ? 'сегодня освоено ✓' : `серия ${s.streak} из 5`}</span></button>`;
      }).join('')}
      <button class="mod-btn mix" data-mod="${MIX.id}"><b>${MIX.title}</b>
        <small>${MIX.size} задач из всех тем вперемешку. Делать в конце каждого занятия.</small></button>
    </div>
    <div class="card">
      <h2>Отправить результаты</h2>
      <p>Нажми кнопку и вставь текст в сообщение.</p>
      <div class="row"><button class="main" id="copy">Скопировать результаты</button>
        <a href="./" class="muted" style="margin-left:auto">← к диагностической работе</a></div>
    </div>`;
  app.querySelectorAll('[data-mod]').forEach(b => b.onclick = () => b.dataset.mod === MIX.id ? startMix() : intro(MODULES.find(m => m.id === b.dataset.mod)));
  document.getElementById('copy').onclick = e => copyResults(e.currentTarget);
}

function intro(mod) {
  app.innerHTML = `
    <div class="row between" style="margin-top:0"><button class="ghost" id="back">← Все темы</button></div>
    <div class="card theory">
      <h2>${mod.title}</h2>
      <h3>Как думать</h3>${mod.theory}
      <h3>Найди ошибку Пети</h3>
      ${mod.oops.map(([wrong, why], i) => `<div class="oops"><b>Петя написал: ${wrong}</b>
        <details><summary>Где ошибка? (сначала подумай сам)</summary><p>${why}</p></details></div>`).join('')}
      <div class="row"><button class="main" id="go">Решать →</button></div>
    </div>`;
  document.getElementById('back').onclick = home;
  document.getElementById('go').onclick = () => { session = { mod }; nextTask(); };
}

function startMix() {
  session = { mod: MIX, mixLeft: MIX.size, mixDone: 0, mixRight: 0 };
  nextTask();
}

function nextTask() {
  if (session.mod === MIX && session.mixLeft === 0) return mixSummary();
  const m = session.mod === MIX ? pick(MODULES) : session.mod;
  Object.assign(session, { task: m.gen(), taskMod: m, tries: 0, caught: false, finished: false });
  renderTask();
}

function renderTask() {
  const { task, taskMod } = session;
  const s = st(taskMod.id);
  const isMix = session.mod === MIX;
  app.innerHTML = `
    <div class="row between" style="margin-top:0">
      <button class="ghost" id="back">← Все темы</button>
      <span class="muted">${isMix ? `Перемешка: задача ${session.mixDone + 1} из ${MIX.size}` : taskMod.title}</span>
    </div>
    <div class="card">
      ${isMix ? '' : `<div class="streak">${[0, 1, 2, 3, 4].map(i => `<span class="${i < Math.min(s.streak, 5) ? 'on' : ''}"></span>`).join('')}</div>`}
      <div class="q">${task.q}${task.expr ? ' = ?' : ''}</div>
      ${task.predict ? `<div class="step"><div class="step-lbl">① ${task.predict.label}</div>
        <div class="choices">${task.predict.options.map(o => `<label><input type="radio" name="pred" value="${o}"><span>${o}</span></label>`).join('')}</div></div>` : ''}
      ${task.scaffold ? `<div class="step"><div class="step-lbl">① ${task.scaffold.label}</div><input type="text" id="scaf" autocomplete="off"></div>` : ''}
      <div class="step"><div class="step-lbl">${task.predict || task.scaffold ? '②' : ''} Ответ${task.formHint ? ` <span class="muted">(${task.formHint})</span>` : ''}:</div>
        <input type="text" id="ans" autocomplete="off"></div>
      ${task.check ? `<div class="step"><div class="step-lbl">③ ${task.check.label}</div><input type="text" id="chk" autocomplete="off"></div>` : ''}
      <div class="row" id="buttons">
        <button class="main" data-conf="sure">Проверить — уверен</button>
        <button class="ghost" data-conf="doubt">Проверить — сомневаюсь</button>
      </div>
      <div id="feedback"></div>
    </div>`;
  document.getElementById('back').onclick = home;
  app.querySelectorAll('[data-conf]').forEach(b => b.onclick = () => submit(b.dataset.conf));
  app.querySelectorAll('input[type=text]').forEach((inp, i, all) => inp.onkeydown = e => {
    if (e.key !== 'Enter') return;
    e.preventDefault();
    // Enter moves on but never submits: confidence must be a deliberate choice.
    if (all[i + 1]) all[i + 1].focus(); else app.querySelector('[data-conf]').focus();
  });
  const first = app.querySelector('input[type=text]');
  if (first && !task.predict) first.focus();
}

function feedback(kind, html, extra = '') {
  document.getElementById('feedback').innerHTML = `<div class="msg ${kind}">${html}</div>${extra}`;
  document.getElementById('buttons').hidden = session.finished;
}

function submit(conf) {
  if (session.finished) return;
  const { task, taskMod } = session;
  const s = st(taskMod.id);

  // 1. Everything filled in?
  const pred = app.querySelector('input[name=pred]:checked')?.value;
  if (task.predict && !pred) return feedback('warn', 'Сначала прикинь ответ — выбери вариант в пункте ①. Это и есть самопроверка.');
  let scaf = null;
  if (task.scaffold) {
    scaf = parse(document.getElementById('scaf').value);
    if (!scaf) return feedback('warn', 'Заполни пункт ① — это подсказка к ответу.');
    if (!eq(scaf.value, task.scaffold.answer)) return feedback('warn', `Пункт ① пока не так. ${task.scaffold.hint}`);
  }
  const p = parse(document.getElementById('ans').value);
  if (!p) return feedback('warn', 'Впиши ответ числом. Дробь — через косую черту (5/2), смешанное число — через пробел (1 3/4), десятичная — через запятую.');
  let chk = null;
  if (task.check) {
    chk = parse(document.getElementById('chk').value);
    if (!chk) return feedback('warn', 'Сделай проверку — пункт ③. Это самое важное в задаче.');
  }

  // 2. Did his own check catch the mistake? That is a win, not a failed try.
  const selfCatch = msg => { session.caught = true; return feedback('info', `🕵️ <b>Стоп — ты сам себя поймал!</b> ${msg} Найди, где ошибка, и исправь.`); };
  // Consistency with his own estimate — independent of whether the estimate is right.
  if (task.predict && task.predict.ref === undefined && signWord(p.value) !== pred)
    return selfCatch(`Ты прикинул, что ответ будет ${pred}, а написал ${fmt(p.value)}. Что-то одно неверно.`);
  if (task.predict && task.predict.ref !== undefined && !eq(p.value, task.predict.ref)
      && (p.value > task.predict.ref ? 'больше' : 'меньше') !== pred)
    return selfCatch(`Ты прикинул, что ответ будет ${pred}, чем ${fmt(task.predict.ref)}, а написал ${fmt(p.value)}. Что-то одно неверно.`);
  if (task.check) {
    const own = task.check.compute ? task.check.compute(p.value) : null;
    if (!eq(chk.value, task.check.target))
      return selfCatch(`Проверка дала ${fmt(chk.value)}, а должно получиться ${fmt(task.check.target)}.`);
    if (own !== null && !eq(own, task.check.target))
      return feedback('warn', `Посчитай проверку ещё раз: если подставить x = ${fmt(p.value)}, слева получится ${fmt(round6(own))}, а не ${fmt(chk.value)}.`);
  }

  // 3. Grade.
  const right = eq(p.value, task.answer) && (!task.form || p.form === task.form);
  const rightValueWrongForm = eq(p.value, task.answer) && task.form && p.form !== task.form;
  if (rightValueWrongForm) return feedback('warn', `Значение верное, но запиши в нужном виде. ${task.formHint}`);
  const predWrong = task.predict && pred !== task.predict.correct;

  session.tries++;
  if (conf === 'sure') { s.sure++; if (!right) s.sureWrong++; }
  log(taskMod, task, document.getElementById('ans').value.trim(), conf, right);

  if (right) {
    session.finished = true;
    s.solved++;
    if (session.tries === 1) { s.firstTry++; s.streak++; } else s.streak = 0;
    if (session.caught) s.selfCaught++;
    let newly = false;
    if (s.streak >= 5 && !s.mastered.includes(today())) { s.mastered.push(today()); newly = true; }
    if (session.mod === MIX) { session.mixLeft--; session.mixDone++; if (session.tries === 1) session.mixRight++; }
    save();
    feedback('ok', `<b>Верно!</b> ${session.caught ? 'И ошибку ты нашёл сам — так и надо.' : ''}
      ${predWrong ? `<br>А вот прикидка была неточной: правильно «${task.predict.correct}». Подумай, почему.` : ''}
      ${newly ? '<br>🎉 <b>5 подряд — тема на сегодня освоена!</b> Можно перейти к другой теме или к «Перемешке».' : ''}`,
      `<details><summary>Посмотреть решение</summary><div class="solution">${task.solution}</div></details>
       <div class="row"><button class="main" id="next">Следующая →</button></div>`);
    document.getElementById('next').onclick = nextTask;
    document.getElementById('next').focus();
    return;
  }

  s.streak = 0;
  if (session.tries === 1) {
    save();
    const why = task.diagnose(p.value, p);
    return feedback('bad', `<b>Пока неверно.</b> ${why}${conf === 'sure' ? '<br><span class="muted">Ты был уверен — запомни, какая проверка поймала бы эту ошибку.</span>' : ''}<br>Попробуй ещё раз.`);
  }
  session.finished = true;
  if (session.mod === MIX) { session.mixLeft--; session.mixDone++; }
  save();
  feedback('bad', `<b>Разберём решение.</b>`,
    `<div class="solution">${task.solution}</div>
     <div class="row"><button class="main" id="next">Следующая →</button></div>`);
  document.getElementById('next').onclick = nextTask;
}

// `typed` is kept as written: "4/2" and "2" are the same number but different mistakes.
function log(mod, task, typed, conf, right) {
  store.log.push({ d: new Date().toISOString().slice(0, 16), m: mod.id,
    q: task.q.replace(/<span class="fr"><span>(.*?)<\/span><span>(.*?)<\/span><\/span>/g, ' $1/$2').replace(/<sup>(.*?)<\/sup>/g, '^$1').replace(/<[^>]+>/g, '').replace(/\s+/g, ' ').trim(),
    a: typed, c: conf, ok: right, t: session.tries });
  if (store.log.length > 400) store.log.splice(0, store.log.length - 400);
}

function mixSummary() {
  app.innerHTML = `<div class="card" style="text-align:center">
    <h2>Перемешка готова</h2>
    <p>С первой попытки: <b>${session.mixRight} из ${MIX.size}</b>.</p>
    <div class="row" style="justify-content:center"><button class="main" id="home">К темам</button>
      <button class="ghost" id="again">Ещё раз</button></div></div>`;
  document.getElementById('home').onclick = home;
  document.getElementById('again').onclick = startMix;
}

function resultsText() {
  const lines = [`Тренажёр, ${new Date().toISOString().slice(0, 16).replace('T', ' ')}`];
  for (const m of MODULES) {
    const s = st(m.id);
    if (!s.solved && !s.sure) continue;
    lines.push(`${m.short}: решено ${s.solved}, с 1-й попытки ${s.firstTry}, уверен-но-неверно ${s.sureWrong}/${s.sure}, сам поймал ${s.selfCaught}, освоено: ${s.mastered.join(', ') || '—'}`);
  }
  const errs = store.log.filter(e => !e.ok).slice(-20);
  if (errs.length) {
    lines.push('', 'Последние ошибки:');
    for (const e of errs) lines.push(`${e.d.slice(5, 10)} ${MODULES.find(m => m.id === e.m)?.short}: ${e.q} → ${e.a}${e.c === 'sure' ? ' (уверен)' : ''}`);
  }
  return lines.join('\n');
}

function copyResults(btn) {
  const text = resultsText();
  const fallback = () => {
    document.getElementById('copy-box')?.remove();
    app.insertAdjacentHTML('beforeend', `<div class="card" id="copy-box"><p>Выдели весь текст (Ctrl+A), скопируй и отправь сообщением.</p>
      <textarea>${text.replace(/&/g, '&amp;').replace(/</g, '&lt;')}</textarea></div>`);
    const t = document.querySelector('#copy-box textarea'); t.focus(); t.select(); t.scrollIntoView();
  };
  if (navigator.clipboard && window.isSecureContext)
    navigator.clipboard.writeText(text).then(() => { btn.textContent = 'Скопировано ✓ — вставь в сообщение'; }).catch(fallback);
  else fallback();
}

home();
</script>
</body>
</html>
