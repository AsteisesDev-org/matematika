function genMono() {
  const kind = pick(['is', 'is', 'std', 'std', 'coef', 'coef', 'deg', 'deg', 'value', 'value', 'formula']);

  if (kind === 'is') {
    const it = pick(MONO_ITEMS), ans = it.yes ? 'да' : 'нет';
    return {
      q: `Является ли одночленом выражение ${it.t}?`,
      answer: ans, options: YESNO, same: v => v === ans,
      diagnose: () => it.why,
      solution: `<p>Одночлен — это произведение чисел и букв в натуральных степенях. Внутри него нет ни сложения, ни вычитания, ни деления на букву.</p>
        <p>${it.t} — <b>${ans === 'да' ? 'одночлен' : 'не одночлен'}</b>. ${it.why}</p>
        <p class="muted">Сумма одночленов (например x + 5) называется многочленом.</p>`
    };
  }

  if (kind === 'std') {
    // The coefficient always splits into two factors > 1, so «перемножь числа» never degenerates into «4 = 4».
    let M;
    do {
      const abs = pick([4, 6, 8, 9, 10, 12, 14, 15, 16]);
      M = randMono(pick(MONO_LETTERS), pick([abs, abs, -abs, -abs]), [1, 1, 2, 2, 3, 4]);
    } while (monoDeg(M) < 3 || !monoKeys(M).some(k => M.v[k] > 1));
    const abs = Math.abs(M.c);
    const parts = abs % 3 === 0 ? [3, abs / 3] : [2, abs / 2];
    const fs = parts.map((p, idx) => (M.c < 0 && idx === 0 ? '−' : '') + p);
    // Only one letter is shown "unfolded" — the rest already stand as powers, как в учебнике 473.
    const open = pick(monoKeys(M).filter(k => M.v[k] > 1));
    for (const k of monoKeys(M)) {
      if (k === open) for (let e = 0; e < M.v[k]; e++) fs.push(k);
      else fs.push(k + (M.v[k] === 1 ? '' : `<sup>${M.v[k]}</sup>`));
    }
    const shown = shuffle(fs).join(' · ');
    const nums = fs.filter(x => /^[−-]?\d+$/.test(x));
    const vals = {};
    for (const k of monoKeys(M)) vals[k] = pick([1, 2, 2, 3]);
    const target = evalMono(M, vals);
    const all1 = { c: M.c, v: Object.fromEntries(monoKeys(M).map(k => [k, 1])) };
    return {
      q: `Приведи одночлен к стандартному виду: ${shown}`,
      answer: M, parseAns: parseMono, same: v => sameMono(v, M), wide: true,
      inputHint: MONO_TYPE, formHint: 'число впереди, каждая буква — в одной степени',
      scaffold: { label: `Сначала перемножь только числа: ${nums.join(' · ')} =`, answer: M.c,
                  hint: 'Числовые множители перемножаются как обычно. Минус, если он есть, остаётся при ответе.' },
      check: { label: `Проверь подстановкой (${valsText(vals)}): значение одночлена =`, target,
               compute: v => evalMono(v, vals) },
      diagnose(v) {
        for (const k of monoKeys(M)) if (M.v[k] > 1 && sameMono(v, { c: round6(M.c * M.v[k]), v: all1.v }))
          return `${k} · ${Array(M.v[k]).fill(k).join(' · ')} — это ${k}<sup>${M.v[k]}</sup>. А ${fmt(round6(M.c * M.v[k]))}${k} получилось бы при сложении: ${Array(M.v[k]).fill(k).join(' + ')}.`;
        if (sameMono(v, all1)) return 'Ты оставил по одной букве каждого вида. Одинаковые буквы нужно собрать в одну степень: a · a · a = a³.';
        if (sameMono({ c: M.c, v: v.v }, M)) return `Буквы собраны верно, а числа нет: ${nums.join(' · ')} = ${fmt(M.c)}.`;
        return 'Числа перемножь отдельно, а одинаковые буквы собери в одну степень — показатель равен числу таких множителей.';
      },
      solution: `<p>Числа перемножаем отдельно: ${nums.join(' · ')} = <b>${fmt(M.c)}</b>.</p>
        <p>Одинаковые буквы — в одну степень:<br>${monoKeys(M).map(k => M.v[k] === 1
          ? `${k} встречается 1 раз → ${k}`
          : `${k} встречается ${pl(M.v[k], 'раз', 'раза', 'раз')} → ${k}<sup>${M.v[k]}</sup>`).join('<br>')}</p>
        <p>Ответ: <b>${monoHtml(M)}</b></p>${monoHowTo(M)}
        <p class="muted">Порядок букв роли не играет: ${monoHtml(M)} и ${monoHtml(M, monoKeys(M).reverse())} — один и тот же одночлен. А вот коэффициент всегда пишут первым.</p>
        <p>Проверка при ${valsText(vals)}: ${shown} = ${fmt(target)} и ${monoHtml(M)} = ${fmt(evalMono(M, vals))} ✓</p>`
    };
  }

  if (kind === 'coef') {
    let M;
    do { M = randMono(pick(MONO_LETTERS), pick([ri(2, 9), -ri(2, 9), 1, -1, 0.5, -0.25, 1.5, -ri(3, 7)]), [1, 2, 2, 3]); }
    while (!monoKeys(M).length);
    return {
      q: `Назови коэффициент одночлена ${monoHtml(M)}.`,
      answer: M.c,
      predict: { label: 'Каким по знаку будет коэффициент?', options: ['положительный', 'отрицательный', 'ноль'], correct: signWord(M.c) },
      diagnose(v) {
        if (eq(v, -M.c)) return 'Знак — часть коэффициента: минус перед одночленом никуда не исчезает.';
        if (eq(v, monoDeg(M))) return 'Ты назвал степень одночлена (сумму показателей букв). Коэффициент — это числовой множитель.';
        if (eq(Math.abs(v), 1) && !eq(Math.abs(M.c), 1)) return 'Число видно в записи — бери его, а не 1.';
        if (eq(Math.abs(M.c), 1)) return 'Если числа в записи нет, коэффициент всё равно есть: это 1 (или −1, если перед одночленом минус).';
        return 'Коэффициент — числовой множитель. Он стоит впереди и берётся вместе со знаком.';
      },
      solution: `<p>Коэффициент — это число, на которое умножаются буквы. Оно стоит впереди и берётся со знаком.</p>
        <p>${monoHtml(M)} = ${monoHtml({ c: M.c, v: {} })} · ${monoHtml({ c: 1, v: M.v })} → коэффициент <b>${fmt(M.c)}</b></p>
        ${eq(Math.abs(M.c), 1) ? '<p class="muted">Число не пишут, когда оно 1: a²b — это 1 · a²b. Но коэффициент при этом есть — 1 (или −1 с минусом).</p>' : ''}`
    };
  }

  if (kind === 'deg') {
    if (Math.random() < 0.12) {
      const ans = 'степень не определена';
      return {
        q: 'Какова степень одночлена 0?',
        answer: ans, options: ['0', '1', ans], same: v => v === ans,
        diagnose: () => 'У числа 0 нет букв, и показателей тоже нет — нельзя сложить. Про 0 говорят: степень не определена.',
        solution: `<p>Степень — сумма показателей букв. В одночлене 0 букв нет, поэтому её сумму взять нельзя.</p>
          <p>Ответ: <b>степень не определена</b>.</p>
          <p class="muted">Любое другое число (5, −7, 0,25) — одночлен нулевой степени: букв нет, сумма показателей равна 0.</p>`
      };
    }
    let M = randMono(pick(MONO_LETTERS), pick([ri(2, 27), -ri(2, 9), 0.5, 1]), [1, 1, 2, 2, 3, 4, 5]);
    const d = monoDeg(M), keys = monoKeys(M);
    const ones = keys.filter(k => M.v[k] === 1).length;
    const mul = keys.reduce((s, k) => s * M.v[k], 1);
    return {
      q: `Какова степень одночлена ${monoHtml(M)}?`,
      answer: d,
      diagnose(v) {
        if (eq(v, M.c)) return 'Коэффициент в степени не участвует: считают только показатели букв.';
        if (keys.length && eq(v, mul) && mul !== d) return 'Показатели при нахождении степени <b>складывают</b>, а не перемножают.';
        if (ones && eq(v, d - ones)) return `У буквы без показателя показатель 1 — её тоже нужно учесть. Таких букв ${ones}.`;
        if (!d && eq(v, 1)) return 'Букв в одночлене нет — сумма показателей пуста, это 0, а не 1.';
        return keys.length ? 'Степень одночлена — сумма показателей всех его букв.' : 'В одночлене нет букв — это число, его степень 0.';
      },
      solution: d === 0
        ? `<p>В одночлене ${monoHtml(M)} нет букв — это число. Его степень считают <b>0</b>.</p>
           <p class="muted">Только 0 — особенный: степень одночлена 0 не определена.</p>`
        : `<p>Складываем показатели всех букв:<br>${keys.map(k => `${k}<sup>${M.v[k]}</sup> → ${M.v[k]}`).join('<br>')}</p>
           <p>Степень: ${keys.map(k => M.v[k]).join(' + ')} = <b>${d}</b></p>
           <p class="muted">Коэффициент ${fmt(M.c)} в расчёт не берётся.</p>`
    };
  }

  if (kind === 'value') {
    let M, vals;
    do {
      M = randMono(pick([['a', 'b'], ['x', 'y'], ['a', 'b', 'c']]), pick([ri(1, 4), -ri(1, 4), 0.5, -0.5, 1.5, 2.5, -0.25]), [1, 1, 2, 2, 3]);
      vals = {};
      for (const k of monoKeys(M)) vals[k] = pick([ri(1, 3), -ri(1, 3), ri(2, 3), -ri(1, 2)]);
    } while (!monoKeys(M).length || Math.abs(evalMono(M, vals)) > 1500);
    const ans = evalMono(M, vals);
    const pow = k => Math.pow(vals[k], M.v[k]);
    const line1 = `${par(M.c)} · ${monoKeys(M).map(k => M.v[k] === 1 ? par(vals[k]) : `${par(vals[k])}<sup>${M.v[k]}</sup>`).join(' · ')}`;
    const line2 = `${par(M.c)} · ${monoKeys(M).map(k => fmt(pow(k))).join(' · ')}`;
    const negPow = monoKeys(M).find(k => M.v[k] > 1 && vals[k] < 0);
    const alt = round6(M.c * monoKeys(M).reduce((s, k) => s * vals[k] * M.v[k], 1));
    return {
      q: `Найди значение одночлена ${monoHtml(M)} при ${valsText(vals)}.`,
      answer: ans,
      predict: { label: 'Каким по знаку будет значение?', options: ['положительный', 'отрицательный', 'ноль'], correct: signWord(ans) },
      ...(negPow ? { scaffold: { label: `Сначала степень: ${par(vals[negPow])}<sup>${M.v[negPow]}</sup> =`, answer: pow(negPow),
                                hint: 'Основание в скобках — со знаком. Минус на минус даёт плюс, поэтому квадрат отрицательного числа положителен.' } } : {}),
      diagnose(v) {
        if (eq(v, -ans)) return 'Числа сошлись, а знак — нет. Посчитай по шагам: сначала степени, потом все умножения вместе с минусами.';
        if (eq(v, alt)) return 'Степень — это не умножение на показатель: (−3)² = (−3) · (−3) = 9, а не −6.';
        if (eq(v, ans / M.c)) return 'Ты потерял коэффициент: его тоже нужно умножить.';
        return 'Подставляй числа в скобках, вместе со знаком: сначала вычисли степени, потом перемножь.';
      },
      solution: `<p>Подставляем числа — каждое в скобках, со знаком:</p><p>${line1}</p>
        <p>Сначала степени:</p><p>${line2}</p>
        <p>Ответ: <b>${fmt(ans)}</b></p>
        ${negPow ? `<p class="muted">Обрати внимание: ${par(vals[negPow])}<sup>${M.v[negPow]}</sup> = ${fmt(pow(negPow))} — ${M.v[negPow] % 2 ? 'нечётная степень сохраняет знак' : 'в скобках минус, и он возводится в степень: минус на минус даёт плюс'}.</p>` : ''}`
    };
  }

  const it = pick(MONO_FORMULAS);
  return {
    q: it.t,
    answer: it.m, parseAns: parseMono, same: v => sameMono(v, it.m), wide: true,
    inputHint: MONO_TYPE, formHint: 'одним одночленом: число впереди, затем буквы',
    scaffold: { label: 'Сколько всего буквенных множителей в ответе? (В 4b — один, в ab — два.)',
                answer: monoDeg(it.m),
                hint: 'Буква, умноженная сама на себя три раза (a · a · a), — это три множителя и a³. А 4 · b — один буквенный множитель.' },
    diagnose(v) {
      if (it.wrong && sameMono(v, it.wrong)) return it.tip;
      if (!monoKeys(v).length) return 'В ответе должна остаться буква: мы записываем зависимость, а не число.';
      return 'Переведи слова в умножение: «в 3 раза больше» → 3 · a, «ребро три раза перемножить» → a · a · a = a³.';
    },
    solution: `<p>${it.tip}</p><p>Ответ: <b>${monoHtml(it.m)}</b></p>${monoHowTo(it.m)}
      <p class="muted">Проверка: подставь любое число, например a = 2, в смысл задачи и в свой ответ — должно совпасть.</p>`
  };
}

// ---------- multiplying monomials and raising them to a power (учебник, §7 п. 22) ----------
function genMonoMul() {
  const kind = pick(['mul', 'mul', 'mul', 'pow', 'pow', 'fill', 'deg']);
  const letters = pick(MONO_LETTERS);

  if (kind === 'mul') {
    let M1, M2, P;
    do {
      M1 = randMono(letters, pick([ri(2, 9), ri(2, 9), -ri(2, 9), -ri(2, 9)]), [1, 1, 2, 2, 3, 4]);
      M2 = randMono(letters, pick([ri(2, 9), ri(2, 9), -ri(2, 9)]), [1, 1, 2, 3]);
      P = monoMul(M1, M2);
    } while (!monoKeys(P).length || monoDeg(P) > 9);
    const cOk = round6(M1.c * M2.c);
    const vals = {};
    for (const k of monoKeys(P)) vals[k] = pick([1, 2, 2, 3]);
    const target = evalMono(P, vals);
    const mulExp = { c: cOk, v: {} };
    for (const k of monoKeys(P)) {
      const e1 = M1.v[k] || 0, e2 = M2.v[k] || 0;
      mulExp.v[k] = e1 && e2 ? e1 * e2 : (e1 || e2);
    }
    return {
      q: monoProduct(M1, M2), expr: true,
      answer: P, parseAns: parseMono, same: v => sameMono(v, P), wide: true,
      inputHint: MONO_TYPE, formHint: 'число впереди, каждая буква — в одной степени',
      scaffold: { label: `Сначала только числа: ${par(M1.c)} · ${par(M2.c)} =`, answer: cOk,
                  hint: 'Коэффициенты перемножаются как обычные числа: минус на минус даёт плюс.' },
      check: { label: `Проверь подстановкой (${valsText(vals)}): значение произведения =`, target,
               compute: v => evalMono(v, vals) },
      diagnose(v) {
        if (sameMono(v, mulExp)) return 'Показатели при <b>умножении</b> складывают: a² · a⁴ = a⁶. Перемножают их тогда, когда степень возводят в степень.';
        if (sameMono(v, { c: M1.c, v: P.v })) return `Буквы собраны верно, а числа не перемножены: ${par(M1.c)} · ${par(M2.c)} = ${fmt(cOk)}.`;
        if (sameMono(v, { c: round6(M1.c + M2.c), v: P.v })) return 'Числа при умножении перемножают, а не складывают.';
        if (sameMono(v, { c: -cOk, v: P.v })) return `Знак: ${par(M1.c)} · ${par(M2.c)} = ${fmt(cOk)}. Минус на минус — плюс, плюс на минус — минус.`;
        return 'Перемножь числа отдельно, а каждую букву — с такой же буквой из другого множителя: показатели сложить.';
      },
      solution: `<p>Числа перемножаем отдельно:<br>${par(M1.c)} · ${par(M2.c)} = <b>${fmt(cOk)}</b></p>
        <p>Буквы — по одной, показатели складываем:<br>${monoMulLines(M1, M2)}</p>
        <p>Ответ: <b>${monoHtml(P)}</b></p>${monoHowTo(P)}
        <p>Проверка при ${valsText(vals)}:<br>${par(evalMono(M1, vals))} · ${par(evalMono(M2, vals))} = ${fmt(target)} и ${monoHtml(P)} = ${fmt(evalMono(P, vals))} ✓</p>`
    };
  }

  if (kind === 'pow') {
    let M, n, R;
    do {
      n = pick([2, 2, 3, 3, 4]);
      M = randMono(letters, pick([ri(2, n > 2 ? 3 : 5), -ri(2, n > 2 ? 3 : 5), ri(2, 3), -ri(2, 2)]), [1, 2, 2, 3]);
      R = monoPow(M, n);
    } while (!monoKeys(R).length || monoDeg(R) > 12 || Math.abs(R.c) > 250);
    const vals = {};
    for (const k of monoKeys(R)) vals[k] = pick([1, 2, 2, 3]);
    const target = round6(Math.pow(evalMono(M, vals), n));
    const cOk = round6(Math.pow(M.c, n));
    const addExp = { c: cOk, v: Object.fromEntries(monoKeys(M).map(k => [k, M.v[k] + n])) };
    return {
      q: `${monoParen(M)}<sup>${n}</sup>`, expr: true,
      answer: R, parseAns: parseMono, same: v => sameMono(v, R), wide: true,
      inputHint: MONO_TYPE, formHint: 'число впереди, каждая буква — в одной степени',
      scaffold: { label: `Сначала коэффициент: (${fmt(M.c)})<sup>${n}</sup> =`, answer: cOk,
                  hint: `Это ${n} ${pl(n, 'множитель', 'множителя', 'множителей')}: ${Array(n).fill(`(${fmt(M.c)})`).join(' · ')}.` },
      check: { label: `Проверь подстановкой (${valsText(vals)}): значение =`, target, compute: v => evalMono(v, vals) },
      diagnose(v) {
        if (sameMono(v, { c: M.c, v: R.v })) return 'Буквы возведены, а число забыто. В степень уходит <b>всё</b> в скобках: (2a)³ = 2³ · a³ = 8a³.';
        if (sameMono(v, { c: -Math.pow(Math.abs(M.c), n), v: R.v }))
          return `Знак решает чётность показателя: ${n} — ${n % 2 ? 'нечётный, минус остаётся' : 'чётный, минус исчезает'}. (${fmt(M.c)})<sup>${n}</sup> = ${fmt(cOk)}.`;
        if (sameMono(v, addExp)) return 'Показатели при возведении степени в степень <b>перемножают</b>: (a²)³ = a<sup>2·3</sup> = a⁶, а не a<sup>2+3</sup>.';
        return 'Возведи в степень и число, и каждую букву: у буквы показатель умножается на внешний.';
      },
      solution: `<p>Скобки означают, что в степень возводится всё внутри:<br>(${fmt(M.c)})<sup>${n}</sup> = ${fmt(cOk)}</p>
        <p>У каждой буквы показатель умножается на ${n}:<br>${monoKeys(M).map(k => `(${k}<sup>${M.v[k]}</sup>)<sup>${n}</sup> = ${k}<sup>${M.v[k]}·${n}</sup> = ${k}<sup>${M.v[k] * n}</sup>`).join('<br>')}</p>
        <p>Ответ: <b>${monoHtml(R)}</b></p>${monoHowTo(R)}
        <p>Проверка при ${valsText(vals)}:<br>(${fmt(evalMono(M, vals))})<sup>${n}</sup> = ${fmt(target)} и ${monoHtml(R)} = ${fmt(evalMono(R, vals))} ✓</p>
        <p class="muted">${n % 2 ? 'Показатель нечётный — знак коэффициента сохранился.' : 'Показатель чётный — минус внутри скобок исчезает.'}</p>`
    };
  }

  if (kind === 'fill') {
    let M1, M2, P;
    do {
      M1 = randMono(letters, pick([ri(2, 6), -ri(2, 4)]), [1, 2, 3]);
      M2 = randMono(letters, pick([ri(2, 9), -ri(2, 9)]), [1, 1, 2, 3]);
      P = monoMul(M1, M2);
    } while (!monoKeys(M1).length || !monoKeys(P).length || monoDeg(P) > 9);
    const vals = {};
    for (const k of monoKeys(P)) vals[k] = pick([1, 2, 2, 3]);
    const target = evalMono(P, vals);
    const addExp = { c: M1.c, v: Object.fromEntries(monoKeys(P).map(k => [k, (P.v[k] || 0) + (M2.v[k] || 0)])) };
    return {
      q: `Какой одночлен надо умножить на ${monoHtml(M2)}, чтобы получилось ${monoHtml(P)}?`,
      answer: M1, parseAns: parseMono, same: v => sameMono(v, M1), wide: true,
      inputHint: MONO_TYPE, formHint: 'число впереди, каждая буква — в одной степени',
      scaffold: { label: `Число: на что надо умножить ${par(M2.c)}, чтобы получить ${fmt(P.c)}?`, answer: M1.c,
                  hint: `Неизвестный множитель находят делением: ${fmt(P.c)} : ${par(M2.c)}.` },
      check: { label: `Проверь: умножь свой ответ на ${monoHtml(M2)} при (${valsText(vals)}). Значение =`, target,
               compute: v => evalMono(monoMul(v, M2), vals) },
      diagnose(v) {
        if (sameMono(v, P)) return 'Ты записал само произведение. Искать нужно второй множитель: произведение разделить на известный множитель.';
        if (sameMono(v, addExp)) return 'Показатели нужно <b>вычитать</b>: a⁶ : a² = a⁴. Складывают их при умножении.';
        if (sameMono(v, { c: round6(P.c / M2.c), v: M2.v })) return 'Буквы взяты от известного множителя. А нужно отнять его показатели от показателей произведения.';
        return 'Делим: числа — на числа, показатели — вычитаем. Проверь умножением.';
      },
      solution: `<p>Неизвестный множитель находят делением произведения на известный множитель:</p>
        <p>${monoHtml(P)} : ${monoHtml(M2)} = ${fmt(P.c)} : ${par(M2.c)} = <b>${fmt(M1.c)}</b> — это коэффициент.</p>
        <p>Показатели вычитаем:<br>${monoKeys(M1).map(k => `${k}<sup>${P.v[k]}</sup> : ${k}<sup>${M2.v[k] || 0}</sup> = ${k}<sup>${M1.v[k]}</sup>`).join('<br>')}</p>
        <p>Ответ: <b>${monoHtml(M1)}</b></p>${monoHowTo(M1)}
        <p>Проверка при ${valsText(vals)}: ${fmt(target)} : ${par(evalMono(M2, vals))} = ${fmt(evalMono(M1, vals))} ✓</p>`
    };
  }

  let M1 = randMono(letters, pick([ri(2, 9), -ri(2, 6)]), [1, 2, 2, 3, 4]);
  let M2 = randMono(letters, pick([ri(2, 9), -ri(2, 6)]), [1, 1, 2, 3]);
  let P = monoMul(M1, M2);
  while (!monoKeys(P).length || monoDeg(P) > 10 || !monoKeys(P).some(k => (M1.v[k] || 0) && (M2.v[k] || 0))) {
    M1 = randMono(letters, pick([ri(2, 9), -ri(2, 6)]), [1, 2, 2, 3, 4]);
    M2 = randMono(letters, pick([ri(2, 9), -ri(2, 6)]), [1, 1, 2, 3]);
    P = monoMul(M1, M2);
  }
  const d = monoDeg(P);
  const mulExp = monoKeys(P).reduce((s, k) => {
    const e1 = M1.v[k] || 0, e2 = M2.v[k] || 0;
    return s * (e1 && e2 ? e1 * e2 : (e1 || e2));
  }, 1);
  return {
    q: `Какова степень одночлена, который получится при умножении ${monoProduct(M1, M2)}?`,
    answer: d,
    diagnose(v) {
      if (eq(v, mulExp) && mulExp !== d) return 'Показатели при умножении складывают, а не перемножают.';
      if (eq(v, d + Math.abs(M1.c * M2.c))) return 'Коэффициент в степень не входит — считают только показатели букв.';
      return 'Сложи показатели всех букв получившегося одночлена: при умножении они складываются.';
    },
    solution: `<p>Соберём произведение:<br>${monoProduct(M1, M2)} = <b>${monoHtml(P)}</b></p>
      <p>Степень — сумма показателей букв:<br>${monoKeys(P).map(k => (M1.v[k] || 0) + (M2.v[k] || 0)).join(' + ')} = <b>${d}</b></p>
      <p class="muted">Заметь: степень произведения равна сумме степеней множителей — ${monoDeg(M1)} + ${monoDeg(M2)} = ${d}.</p>`
  };
}

// ---------- y = x² and y = x³ and their graphs (учебник, §7 п. 23) ----------
const SQ = { t: 'y = x<sup>2</sup>', name: 'y = x²', f: x => x * x, xr: 4, yr: 16 };
const CUBE = { t: 'y = x<sup>3</sup>', name: 'y = x³', f: x => x * x * x, xr: 3, yr: 27 };
const powLine = (x, w) => w === 'sq'
  ? `${par(x)}<sup>2</sup> = ${Array(2).fill(par(x)).join(' · ')} = ${fmt(x * x)}`
  : `${par(x)}<sup>3</sup> = ${Array(3).fill(par(x)).join(' · ')} = ${fmt(x * x * x)}`;

function genSqCube() {
  const kind = pick(['val', 'val', 'val', 'arg', 'arg', 'member', 'member', 'which', 'count', 'count', 'symm']);
  const w = kind === 'which' ? pick(['sq', 'cube']) : pick(['sq', 'sq', 'cube']);
  const F = w === 'sq' ? SQ : CUBE, f = F.f;
  const pic = (pts = [], h = null) => curvePlot({ f, xr: F.xr, yr: F.yr, points: pts, h });

  if (kind === 'val') {
    const mx = w === 'sq' ? 4 : 3;
    const x0 = pick([ri(-mx, -1), ri(1, mx), ri(-mx, mx), ri(1, mx)]);
    const y0 = f(x0);
    return {
      q: `Функция задана формулой ${F.t}. Найди y при x = ${fmt(x0)}.`,
      answer: y0,
      predict: { label: 'Каким по знаку будет y?', options: ['положительный', 'отрицательный', 'ноль'], correct: signWord(y0) },
      diagnose(v) {
        if (eq(v, -y0)) return w === 'sq'
          ? 'Квадрат отрицательным не бывает: (−4) · (−4) = 16. Другое дело −4² без скобок — там минус снаружи.'
          : 'Куб сохраняет знак x: если x отрицательный, то и y отрицательный.';
        if (w === 'sq' && eq(v, x0 * 2)) return 'x² — это x · x, а не 2x. Например (−4)² = (−4) · (−4) = 16.';
        if (w === 'cube' && eq(v, x0 * 3)) return 'x³ — это x · x · x: (−2)³ = −8, а не −6.';
        if (w === 'cube' && eq(v, x0 * x0)) return 'Ты возвёл в квадрат. Здесь три множителя: x · x · x.';
        if (w === 'sq' && eq(v, x0 * x0 * x0)) return 'Это куб — он для y = x³. Тут только два множителя.';
        return `Подставь x в скобках, вместе со знаком: ${powLine(x0, w)}.`;
      },
      solution: `<p>Формула — это рецепт: вместо x пишем ${par(x0)} — со знаком и в скобках.</p>
        <p>y = ${powLine(x0, w)}</p>
        <p>Ответ: <b>${fmt(y0)}</b></p>${pic([{ x: x0, y: y0 }])}
        ${w === 'sq' ? '<p class="muted">Квадрат любого числа не меньше нуля — поэтому график y = x² не опускается под ось x.</p>'
          : '<p class="muted">Куб сохраняет знак: при x &lt; 0 и y отрицательный, поэтому график y = x³ уходит вниз.</p>'}`
    };
  }

  if (kind === 'arg') {
    const mx = w === 'sq' ? 4 : 3;
    const x0 = pick([ri(2, mx), -ri(2, mx)]), y0 = f(x0);
    const ans = w === 'sq' ? Math.abs(x0) : x0;
    return {
      q: `Функция задана формулой ${F.t}. При каком ${w === 'sq' ? '<b>положительном</b> ' : ''}x значение y равно ${fmt(y0)}?`,
      answer: ans,
      check: { label: 'Проверь подстановкой. y =', target: y0, compute: v => round6(f(v)) },
      diagnose(v) {
        if (w === 'sq' && eq(v, -ans)) return `−${Math.abs(ans)} тоже подходит: (−${Math.abs(ans)})² = ${fmt(y0)}. Но в вопросе просят положительное число.`;
        if (eq(v, y0)) return `${fmt(y0)} — это y. Нужно решить уравнение ${fmt(y0)} = ${F.t}.`;
        if (w === 'sq' && eq(v, y0 / 2)) return 'x² = a не решается делением на 2. Нужно число, которое само на себя даёт a.';
        return `Ищи число, которое ${w === 'sq' ? 'само на себя' : 'три раза само на себя'} даёт ${fmt(y0)}.`;
      },
      solution: w === 'sq'
        ? `<p>Пишем уравнение: x<sup>2</sup> = ${fmt(y0)}.</p>
           <p>Нужны числа, которые сами на себя дают ${fmt(y0)}: это ${fmt(ans)} и ${fmt(-ans)} — <b>два корня</b>
           (${fmt(ans)} · ${fmt(ans)} = ${fmt(y0)} и (${fmt(-ans)}) · (${fmt(-ans)}) = ${fmt(y0)}).</p>
           <p>По условию нужно положительное: <b>${fmt(ans)}</b></p>${pic([{ x: ans, y: y0 }, { x: -ans, y: y0 }])}
           <p class="muted">Обе точки одной высоты — график симметричен относительно оси y.</p>`
        : `<p>Пишем уравнение: x<sup>3</sup> = ${fmt(y0)}.</p>
           <p>Три одинаковых множителя дают ${fmt(y0)} только у одного числа: <b>${fmt(ans)}</b>
           (${Array(3).fill(par(ans)).join(' · ')} = ${fmt(y0)}).</p>
           <p class="muted">У куба корень всегда один: (−2)³ = −8, а (+2)³ = 8 — это разные числа.</p>${pic([{ x: ans, y: y0 }])}`
    };
  }

  if (kind === 'member') {
    const mx = w === 'sq' ? 4 : 3;
    const x0 = pick([ri(-mx, mx), ri(1, mx), -ri(1, mx)]);
    const yTrue = f(x0);
    const on = Math.random() < 0.5;
    let yP = on ? yTrue : pick([w === 'sq' ? -Math.abs(yTrue) - 1 : -yTrue, yTrue + pick([-2, -1, 1, 2])]);
    if (yP === yTrue) yP = yTrue + 1;
    const ans = on ? 'да' : 'нет';
    return {
      q: `Принадлежит ли точка M(${fmt(x0)}; ${fmt(yP)}) графику функции ${F.t}?`,
      answer: ans, options: YESNO, same: v => v === ans,
      scaffold: { label: `Подставь x = ${fmt(x0)} в формулу. По формуле y =`, answer: yTrue,
                  hint: w === 'sq' ? 'Пиши (−3)², а не −3²: скобки сохраняют минус, и квадрат получается положительным.'
                    : 'Три множителя: (−2) · (−2) · (−2). Нечётное число минусов — ответ отрицательный.' },
      diagnose: () => `При x = ${fmt(x0)} формула даёт y = ${fmt(yTrue)}, а у точки y = ${fmt(yP)}. ${on ? 'Совпало — точка лежит на графике.' : 'Не совпало — точка вне графика.'}`,
      solution: `<p>Точка лежит на графике, если её координаты подходят под формулу. Подставляем x = ${fmt(x0)}:</p>
        <p>y = ${powLine(x0, w)}</p>
        <p>Формула даёт ${fmt(yTrue)}, у точки ${fmt(yP)}. ${on ? 'Совпадает — <b>лежит</b>.' : 'Не совпадает — <b>не лежит</b>.'}</p>
        ${pic([{ x: x0, y: yTrue, color: '#2e8b57' }, { x: x0, y: yP, color: on ? '#2e8b57' : '#c0392b' }])}
        ${!on && w === 'sq' && yP < 0 ? '<p class="muted">Короткий путь: у y = x² значение никогда не бывает отрицательным — такая точка не лежит на графике ни при каком x.</p>' : ''}`
    };
  }

  if (kind === 'which') {
    const opts = ['y = x²', 'y = x³', 'y = 2x'];
    return {
      q: `Какая функция задана этим графиком?<div>${pic([{ x: 1, y: f(1) }, { x: -1, y: f(-1) }, { x: 2, y: f(2) }])}</div>`,
      answer: F.name, options: opts, same: v => v === F.name,
      diagnose(v) {
        if (v === 'y = 2x') return 'График y = 2x — прямая. Здесь линия изогнута, значит это не она.';
        return w === 'sq' ? 'Смотри на левую половину: линия идёт вверх, точки (−2; 4) и (2; 4) одинаковой высоты.'
          : 'Смотри на левую половину: при x &lt; 0 график идёт вниз — значит, y отрицательный.';
      },
      solution: w === 'sq'
        ? `<p>Проверим по отмеченным точкам: при x = −2 получаем y = ${fmt(f(-2))}. Значит, это возведение в квадрат.</p>
           <p>График не опускается под ось x и симметричен относительно оси y — это <b>парабола</b>, y = x².</p>${pic()}`
        : `<p>Проверим по отмеченным точкам: при x = −2 получаем y = ${fmt(f(-2))} — значение отрицательное. Значит, это куб.</p>
           <p>График идёт вниз слева и вверх справа, симметричен относительно начала координат — это <b>кубическая парабола</b>, y = x³.</p>${pic()}`
    };
  }

  if (kind === 'count') {
    const OPTS = ['ни одного', 'один', 'два'];
    if (w === 'cube') {
      const a = pick([1, 8, 27, -1, -8, -27]), root = Math.round(Math.cbrt(a));
      return {
        q: `Сколько корней имеет уравнение x<sup>3</sup> = ${fmt(a)}?`,
        answer: 'один', options: OPTS, same: v => v === 'один',
        diagnose: () => `Нужно число, которое три раза само на себя даёт ${fmt(a)}. Такое число только одно: ${fmt(root)}.`,
        solution: `<p>x = ${par(root)}, потому что ${Array(3).fill(par(root)).join(' · ')} = ${fmt(a)}.</p>
          <p>Другого числа нет: куб сохраняет знак, поэтому ${fmt(a)} дают ровно одним числом.</p>
          <p>Ответ: <b>один корень</b>.</p>${pic([{ x: root, y: a }], a)}`
      };
    }
    const a = pick([4, 9, 16, 1, 0, -1, -4, -9, -16]);   // всё влезает в рамку графика (yr = 16)
    const n = a > 0 ? 2 : a === 0 ? 1 : 0, root = a > 0 ? Math.round(Math.sqrt(a)) : 0;
    return {
      q: `Сколько корней имеет уравнение x<sup>2</sup> = ${fmt(a)}?`,
      answer: OPTS[n], options: OPTS, same: v => v === OPTS[n],
      diagnose(v) {
        if (a > 0 && v === OPTS[1]) return `Ты нашёл только ${fmt(root)}. Но и (${fmt(-root)})² = ${fmt(a)} — минус на минус даёт плюс.`;
        if (a < 0 && v !== OPTS[0]) return 'Квадрат любого числа не меньше нуля. Отрицательного значения у x² не бывает — корней нет.';
        if (a === 0 && v !== OPTS[1]) return 'x² = 0 только при x = 0. Единственный корень — сам ноль.';
        return 'Посчитай на графике: сколько раз горизонтальная прямая y = ' + fmt(a) + ' пересекает параболу.';
      },
      solution: a > 0
        ? `<p>Ищем числа, которые сами на себя дают ${fmt(a)}: это ${fmt(root)} и ${fmt(-root)}.</p>
           <p>Проверка: ${fmt(root)} · ${fmt(root)} = ${fmt(a)} и (${fmt(-root)}) · (${fmt(-root)}) = ${fmt(a)} ✓</p>
           <p>Ответ: <b>два корня</b>.</p>${pic([{ x: root, y: a }, { x: -root, y: a }], a)}`
        : a === 0
        ? `<p>x² = 0 только при x = 0 — других чисел нет.</p><p>Ответ: <b>один корень</b>.</p>${pic([{ x: 0, y: 0 }], 0)}`
        : `<p>Квадрат не бывает отрицательным, поэтому x² = ${fmt(a)} не имеет корней.</p>
           <p>На графике видно: пунктирная прямая y = ${fmt(a)} проходит ниже параболы и не пересекает её.</p>
           <p>Ответ: <b>ни одного корня</b>.</p>${pic([], a)}`
    };
  }

  const smax = w === 'sq' ? 4 : 3;
  const x0 = pick([ri(1, smax), -ri(1, smax)]), y0 = f(x0);
  const about = w === 'sq' ? 'оси y' : 'начала координат';
  const askX = w === 'sq';
  const ans = askX ? -x0 : -y0;
  return {
    q: `Точка A(${fmt(x0)}; ${fmt(y0)}) лежит на графике ${F.t}. Какая точка этого графика симметрична ей относительно ${about}? Впиши ${askX ? 'её x-координату' : 'её y-координату'}.`,
    answer: ans,
    predict: { label: 'Каким по знаку будет это число?', options: ['положительный', 'отрицательный', 'ноль'], correct: signWord(ans) },
    diagnose(v) {
      if (eq(v, x0)) return `Ты взял ту же точку. Симметричная — с ${askX ? 'другой стороны оси y' : 'противоположного конца графика'}.`;
      if (askX && eq(v, y0)) return `${fmt(y0)} — это y точки A. Нужна x-координата: то же число, но с другим знаком.`;
      if (!askX && eq(v, -x0)) return 'У куба меняются обе координаты. Нужна y-координата: это −y, а не −x.';
      return askX ? 'Симметрия относительно оси y: x меняет знак, y остаётся тем же.'
        : 'Симметрия относительно начала координат: меняются знаком обе координаты.';
    },
    solution: askX
      ? `<p>Квадрат не чувствует знака: (${fmt(-x0)})² = ${fmt(x0)}² = ${fmt(y0)}. Значит, точка (${fmt(-x0)}; ${fmt(y0)}) тоже на графике.</p>
         <p>Она — зеркальное отражение A относительно оси y: <b>x = ${fmt(ans)}</b>.</p>
         ${pic([{ x: x0, y: y0 }, { x: -x0, y: y0 }])}`
      : `<p>Куб меняет знак вместе с x: ${par(-x0)}<sup>3</sup> = ${fmt(-y0)}. Значит, точка (${fmt(-x0)}; ${fmt(-y0)}) тоже на графике.</p>
         <p>Она симметрична A относительно начала координат: <b>y = ${fmt(ans)}</b>.</p>
         ${pic([{ x: x0, y: y0 }, { x: -x0, y: -y0 }])}`
  };
}

// ---------- number intervals ----------
function intervalLine(a, b, L, R) {
  const lo = a - 2, hi = b + 2, W = 520, pad = 20, u = (W - 2 * pad) / (hi - lo), X = v => pad + (v - lo) * u;
  let s = `<svg viewBox="0 0 ${W} 70" width="${W}" height="70" xmlns="http://www.w3.org/2000/svg">
    <line x1="10" y1="35" x2="${W - 10}" y2="35" stroke="#333" stroke-width="1.5"/>
    <line x1="${X(a)}" y1="35" x2="${X(b)}" y2="35" stroke="#3f6ad8" stroke-width="6"/>`;
  for (let v = lo + 1; v < hi; v++) s += `<line x1="${X(v)}" y1="30" x2="${X(v)}" y2="40" stroke="#333"/><text x="${X(v)}" y="60" font-size="13" text-anchor="middle">${fmt(v)}</text>`;
  s += `<circle cx="${X(a)}" cy="35" r="6" fill="${L === '[' ? '#3f6ad8' : '#fff'}" stroke="#3f6ad8" stroke-width="2.5"/>
    <circle cx="${X(b)}" cy="35" r="6" fill="${R === ']' ? '#3f6ad8' : '#fff'}" stroke="#3f6ad8" stroke-width="2.5"/>`;
  return s + '</svg>';
}
const ivStr = (a, b, L, R) => `${L}${fmt(a)}; ${fmt(b)}${R}`;
// "[-2; 5)", "[−2;5)", "[-2, 5)" -> "[-2;5)"
function parseInterval(str) {
  const m = String(str || '').replace(/[−–—]/g, '-').replace(/\s+/g, '').match(/^([\[(])(-?\d+)[;,](-?\d+)([\])])$/);
  return m ? { value: `${m[1]}${+m[2]};${+m[3]}${m[4]}`, form: 'interval' } : null;
}

function genInterval() {
  const a = ri(-5, 2), b = a + ri(3, 7), L = pick(['[', '(']), R = pick([']', ')']);
  const iv = ivStr(a, b, L, R), line = intervalLine(a, b, L, R);
  const inL = L === '[', inR = R === ']';
  const ints = []; for (let v = a; v <= b; v++) if ((v > a || inL) && (v < b || inR)) ints.push(v);
  const rule = '<p class="muted">Квадратная скобка [ ] — конец входит (на рисунке закрашенная точка). Круглая ( ) — не входит (пустая точка).</p>';
  const kind = pick(['count', 'member', 'member', 'write', 'write', 'edge']);

  if (kind === 'count') {
    return {
      q: `Сколько целых чисел в промежутке ${iv}?`, answer: ints.length,
      diagnose(v) {
        if (eq(v, b - a + 1) && !(inL && inR)) return 'Ты посчитал оба конца. Но конец с круглой скобкой не входит.';
        if (eq(v, b - a)) return `Выпиши все числа подряд от ${fmt(a)} до ${fmt(b)}${ints.includes(0) ? ', не забудь 0,' : ''} и вычеркни концы с круглой скобкой.`;
        return `Выпиши все целые числа от ${fmt(a)} до ${fmt(b)} и вычеркни концы с круглой скобкой.`;
      },
      solution: `<p>Целые от ${fmt(a)} до ${fmt(b)}: ${Array.from({ length: b - a + 1 }, (_, i) => a + i).map(v => ints.includes(v) ? fmt(v) : `<s>${fmt(v)}</s>`).join(', ')}.</p>
        <p>${inL ? `${fmt(a)} входит ([)` : `${fmt(a)} не входит (()`}, ${inR ? `${fmt(b)} входит (])` : `${fmt(b)} не входит ())`}. Всего: <b>${ints.length}</b>.</p>${line}${rule}`
    };
  }
  if (kind === 'member') {
    const x = pick([a, b, a, b, a + 1, b - 1, a - 1, b + 1]);
    const ans = ints.includes(x) || (x > a && x < b) ? 'да' : 'нет';
    const why = x === a ? `${fmt(a)} — левый конец, скобка «${L}» — ${inL ? 'входит' : 'не входит'}.`
      : x === b ? `${fmt(b)} — правый конец, скобка «${R}» — ${inR ? 'входит' : 'не входит'}.`
      : x > a && x < b ? `${fmt(x)} лежит между ${fmt(a)} и ${fmt(b)} — входит.` : `${fmt(x)} лежит за пределами промежутка — не входит.`;
    return {
      q: `Принадлежит ли число ${fmt(x)} промежутку ${iv}?`, answer: ans, options: YESNO, same: v => v === ans,
      diagnose: () => why, solution: `<p>${why}</p>${line}${rule}`
    };
  }
  if (kind === 'write') {
    const ineq = `${fmt(a)} ${inL ? '≤' : '&lt;'} x ${inR ? '≤' : '&lt;'} ${fmt(b)}`;
    const ans = `${L}${a};${b}${R}`;
    return {
      q: `Запиши в виде промежутка: ${ineq}`, answer: ans, parseAns: parseInterval, same: v => v === ans,
      formHint: 'например (1; 3] или [−4; 2)', inputHint: 'Запиши промежуток: скобка, число, точка с запятой, число, скобка. Например: (1; 3] или [−4; 2).',
      diagnose(v) {
        const [, l2, n1, n2, r2] = v.match(/^([\[(])(-?\d+);(-?\d+)([\])])$/);
        if (+n1 === a && +n2 === b) return '≤ — число входит, ставим квадратную скобку [ ]. &lt; — не входит, круглую ( ).';
        if (+n1 === b && +n2 === a) return 'Сначала пишется меньшее число, потом большее.';
        return `Числа берутся прямо из неравенства: ${fmt(a)} и ${fmt(b)}. Ничего прибавлять и вычитать не нужно.`;
      },
      solution: `<p>Числа — из неравенства: от ${fmt(a)} до ${fmt(b)}.</p>
        <p>${inL ? `${fmt(a)} ≤ x — ${fmt(a)} входит → [` : `${fmt(a)} &lt; x — ${fmt(a)} не входит → (`}; &nbsp;
        ${inR ? `x ≤ ${fmt(b)} — ${fmt(b)} входит → ]` : `x &lt; ${fmt(b)} — ${fmt(b)} не входит → )`}</p>
        <p>Ответ: <b>${iv}</b></p>${line}`
    };
  }
  const small = Math.random() < 0.5, ans = small ? ints[0] : ints[ints.length - 1];
  return {
    q: `${small ? 'Наименьшее' : 'Наибольшее'} целое число в промежутке ${iv}?`, answer: ans,
    diagnose(v) {
      if (eq(v, small ? a : b)) return `Скобка у ${fmt(small ? a : b)} круглая — это число не входит. Возьми соседнее, которое внутри.`;

// ---------- completing the square (grade 8) ----------
// The answer is two roots, typed "4; -2" (order does not matter). Index marks
// (x₁, x2), stray letters and "=" are stripped so "x = 4; x = -2" also counts;
// exactly two numbers are required.
function parseRoots(str) {
  const s = String(str || '').replace(/[−–—]/g, '-')
    .replace(/[₀-₉]/g, '')            // subscript digits are root indices, not values
    .replace(/[xхyу]\s*\d+/gi, '')    // "x1", "x2" — an index with its number
    .replace(/[xхyу]/gi, '')          // a lone letter
    .replace(/=/g, ' ')
    .replace(/-\s+(\d)/g, '-$1');     // "− 6" (space after minus) is still −6, not 6
  const m = s.match(/-?\d+(?:[.,]\d+)?/g);
  if (!m || m.length !== 2) return null;
  const vals = m.map(v => parse(v));
  if (vals.some(p => !p) || !vals.every(p => Number.isFinite(p.value))) return null;
  return { value: vals.map(p => p.value).sort((a, b) => a - b), form: 'roots' };
}
function genSqComp() {
  // x² + b·x + c = 0 with b = 2u; (x + u)² = d², roots −u ± d. Chosen so both
  // roots are integers: c = u² − d². Avoid u = 0 (b = 0) and |u| = d (c = 0).
  let u, d;
  do { u = pick([-6, -5, -4, -3, -2, 2, 3, 4, 5, 6]); d = ri(1, 4); } while (Math.abs(u) === d);
  const b = 2 * u, c = u * u - d * d;
  const r1 = -u + d, r2 = -u - d;
  const roots = [Math.min(r1, r2), Math.max(r1, r2)];
  const bTerm = (b < 0 ? '− ' : '+ ') + Math.abs(b) + 'x';
  const cTerm = (c < 0 ? '− ' : '+ ') + Math.abs(c);
  const binom = `(x ${u < 0 ? '−' : '+'} ${Math.abs(u)})`;
  const checkLine = r => `(${fmt(r)})<sup>2</sup> ${b < 0 ? '−' : '+'} ${Math.abs(b)}·(${fmt(r)}) ${c < 0 ? '−' : '+'} ${Math.abs(c)} = 0 ✓`;
  return {
    q: `Реши уравнение выделением квадрата двучлена:<br>x<sup>2</sup> ${bTerm} ${cTerm} = 0`,
    answer: roots, parseAns: parseRoots,
    same: v => v.length === 2 && eq(v[0], roots[0]) && eq(v[1], roots[1]),
    formHint: 'оба корня через точку с запятой',
    inputHint: 'Запиши оба корня через точку с запятой, например: 2; 5. Порядок не важен.',
    scaffolds: [
      { label: `Шаг 1. Перенеси число в правую часть (знак меняется): x<sup>2</sup> ${bTerm} = ?`,
        parse: parseRightSide,
        inputHint: 'Можно вписать всю строку целиком (вида «x² + … = число») — а можно только число справа от «=».',
        answer: -c, hint: `Переносим ${fmt(c)} через «=» — его знак становится противоположным: ${fmt(-c)}.` },
      { label: `Шаг 2. Число при x раздели пополам и возведи в квадрат — это добавка к обеим частям: (${fmt(b)} : 2)<sup>2</sup> = ?`,
        answer: u * u, hint: `Половина от ${fmt(b)} равна ${fmt(u)}. Её квадрат: (${fmt(u)})<sup>2</sup> = ${u * u}.` },
      { label: `Шаг 3. Прибавь ${u * u} к обеим частям. Слева выйдет ${binom}<sup>2</sup>, справа ${fmt(-c)} + ${u * u} = ?`,
        answer: d * d, hint: `${fmt(-c)} + ${u * u} = ${d * d}. Значит ${binom}<sup>2</sup> = ${d * d}.` },
    ],
    diagnose(v) {
      if (!Array.isArray(v) || v.length !== 2) return 'Нужно два числа — оба корня. Запиши их через точку с запятой.';
      const bad = [Math.min(u + d, u - d), Math.max(u + d, u - d)];
      if (eq(v[0], bad[0]) && eq(v[1], bad[1]))
        return `Ты взял ${fmt(u)} ± ${fmt(d)}, а надо <b>${fmt(-u)} ± ${fmt(d)}</b>: у ${fmt(u)} при переносе вправо знак меняется на противоположный.`;
      return `Сначала выдели квадрат: ${binom}<sup>2</sup> = ${d * d}. Потом извлеки корень с двумя знаками: x ${u < 0 ? '−' : '+'} ${Math.abs(u)} = ${fmt(d)} <b>или</b> ${fmt(-d)} — отсюда два корня.`;
    },
    solution: `<p>Переносим ${fmt(c)} вправо (знак меняется):<br>x<sup>2</sup> ${bTerm} = ${fmt(-c)}</p>
      <p>Половина числа при x: ${fmt(b)} : 2 = ${fmt(u)}. Её квадрат: (${fmt(u)})<sup>2</sup> = ${u * u}. Прибавляем к <b>обеим</b> частям:<br>x<sup>2</sup> ${bTerm} + ${u * u} = ${fmt(-c)} + ${u * u}</p>
      <p>Слева — полный квадрат, справа ${d * d}:<br>${binom}<sup>2</sup> = ${d * d}</p>
      <p>Извлекаем корень — не забываем «±»:<br>x ${u < 0 ? '−' : '+'} ${Math.abs(u)} = ${fmt(d)} &nbsp;или&nbsp; x ${u < 0 ? '−' : '+'} ${Math.abs(u)} = ${fmt(-d)}</p>
      <p>Переносим ${fmt(u)}: x = ${fmt(r1)} &nbsp;или&nbsp; x = ${fmt(r2)}</p>
      <p>Ответ: <b>x = ${fmt(roots[0])}</b> и <b>x = ${fmt(roots[1])}</b></p>
      <p class="muted">Проверка подстановкой:<br>${checkLine(roots[0])}<br>${checkLine(roots[1])}</p>`
  };
}

      rule: `<ul><li><b>Одночлен</b> — произведение чисел и букв в натуральных степенях. Сложения и деления на букву внутри нет.</li>

      if (a.hits < b.hits || (a.hits === b.hits && a.due > b.due)) w = i;
    }
    store.queue.splice(w, 1);
  }
}
function journalPass(e) {
  e.hits++;

  else e.due = addDays(today(), GAPS[e.hits]);
}
function journalBack(e) { e.hits = 0; e.due = addDays(today(), GAPS[0]); }

// Worked examples revealed one step at a time; "your turn" steps make him write the step himself.
// "Решать" appears only at the end, so the lesson cannot be scrolled past.
function lessonScreen(mod) {
  const L = mod.lesson;
  app.innerHTML = `
    <div class="row between" style="margin-top:0"><button class="ghost" id="back">← Все темы</button></div>
    <div class="card theory"><h2>${mod.n}. ${mod.title}</h2><div id="stages">${stages(mod, 1)}</div>
      ${theoryDone(mod) ? '<p class="muted">Теорию ты уже прошёл — можно повторить её или сразу перейти к практике.</p>' : ''}
      <p class="hook">${L.hook}</p>
      <div id="lesson"></div><div class="row" id="lnext"></div></div>`;
  document.getElementById('back').onclick = home;
  wireStages(mod);
  const items = L.examples.flatMap((ex, i) => [{ ex: i }, ...ex.steps.map((s, j) => ({ ex: i, step: j }))]);
  const box = document.getElementById('lesson'), nextBox = document.getElementById('lnext');
  const stepOf = it => L.examples[it.ex].steps[it.step];
  let p = 0;
  const reveal = (s, li, note = '') => {
    li.innerHTML = `${note}<div class="lmath">${s.math}</div>${s.why ? `<div class="lwhy">${s.why}</div>` : ''}${s.pic || ''}`;
  };
  function advance() {
    if (p >= items.length) return finish();
    const it = items[p++];
    if (it.step === undefined) {
      const ex = L.examples[it.ex];
      box.insertAdjacentHTML('beforeend', `<div class="lex"><div class="lex-h">Пример ${it.ex + 1} из ${L.examples.length}${ex.title ? ' · ' + ex.title : ''}</div>
        <div class="lproblem">${ex.problem}</div><ol class="lsteps" id="lex${it.ex}"></ol></div>`);
      box.lastElementChild.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      return wait();
    }
    const s = stepOf(it), li = document.createElement('li');
    li.className = 'lstep';
    document.getElementById('lex' + it.ex).appendChild(li);
    if (s.try) return yourTurn(s, li);
    reveal(s, li);
    li.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    wait();
  }
  function wait() {
    if (p >= items.length) return finish();
    const nx = items[p];
    if (nx.step !== undefined && stepOf(nx).try) { nextBox.innerHTML = ''; return advance(); }
    const s = nx.step !== undefined ? stepOf(nx) : null;
    nextBox.innerHTML = `${s && s.think ? '<div class="think">🤔 Как думаешь, какой следующий шаг? Подумай — потом открой.</div>' : ''}
      <button class="main" id="lgo">${s ? `Шаг ${nx.step + 1} из ${L.examples[nx.ex].steps.length} →` : 'Следующий пример →'}</button>`;
    document.getElementById('lgo').onclick = advance;
  }
  function yourTurn(s, li) {
    nextBox.innerHTML = '';
    li.innerHTML = `<div class="ltry"><div class="step-lbl">✍️ <b>Твоя очередь.</b> ${s.try.label}</div>
      <input type="text" autocomplete="off"${s.try.wide ? ' style="width:320px"' : ''}> <button class="main">Проверить</button><div class="lfb"></div></div>`;
    const inp = li.querySelector('input'), btn = li.querySelector('button'), fb = li.querySelector('.lfb');
    let tries = 0;
    inp.focus();
    inp.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); btn.click(); } };
    btn.onclick = () => {
      const v = (s.try.parse || parse)(inp.value);
      if (!v) { fb.innerHTML = `<div class="msg warn">${s.try.inputHint || 'Впиши ответ числом.'}</div>`; return; }
      if (s.try.reject && s.try.reject(v)) { fb.innerHTML = `<div class="msg warn">${s.try.reject(v)}</div>`; return; }
      if (stepRight(s.try, v.value)) { reveal(s, li, `<div class="msg ok">✓ Верно: ${esc(inp.value)}</div>`); return wait(); }
      if (++tries < 2) { fb.innerHTML = `<div class="msg bad">Пока не так. ${s.try.hint}</div>`; return; }
      reveal(s, li, `<div class="msg bad">Не беда — вот как правильно:</div>`);
      wait();
    };
  }
  function finish() {
    store.lessons[mod.id] = today(); save();
    box.insertAdjacentHTML('beforeend', `<div class="rule"><h3>📌 Запомни</h3>${L.rule}</div><h3>Найди ошибку Пети</h3>${oopsHtml(mod)}`);
    // The practice part has just unlocked: show it in the strip and offer the way in.
    document.getElementById('stages').innerHTML = stages(mod, 1);
    wireStages(mod);
    nextBox.innerHTML = '<div class="think">🔓 Теория пройдена — практика открыта!</div><button class="main" id="go">✏️ К практике →</button>';
    document.getElementById('go').onclick = () => practice(mod);
  }
  advance();
}

// ---------- «Ошибки Пети» ----------
// Two widgets only: "исправь" (text, checked with the module's own parser) for real mistakes,
// "Петя прав?" (choice) for traps and verbal claims. Which kind THIS line is stays hidden
// until the answer is checked — that is the drill.
const oopsCard = s => '<div class="oops"><b>Петя написал:</b> ' + s + '</div>';
function oopsAnswerTask(mod, wrong, why, meta) {
  if (meta.kind === 'verdict')
    return { _mod: mod, q: oopsCard(wrong) + '<br>Петя прав?', options: ['прав', 'ошибся'], answer: 'ошибся',
      same: v => v === 'ошибся', solution: '<p><b>Петя ошибся.</b> ' + why + '</p>',
      diagnose: () => 'Проверь Петино равенство числом: подставь и посчитай обе части.' };
  const base = { _mod: mod, answer: meta.fix, q: oopsCard(wrong) + '<br>' + (meta.ask || 'В Петиной записи ошибка. Исправь — напиши, как правильно:'),
    solution: '<p><b>Правильно:</b> ' + (meta.show || meta.fix) + '</p><p>' + why + '</p>' };
  if (meta.kind === 'num') {
    const T = parse(meta.fix).value;
    Object.assign(base, { parseAns: parseRightSide, same: v => eq(v, T),
      diagnose: () => 'Подставь своё число вместо Петиного — не сходится? Пересчитай и сверь знак и запятую.' });
  } else if (meta.kind === 'lin') {
    const T = parseLinear(meta.fix).value;
    Object.assign(base, { parseAns: parseLinear, wide: true, same: v => sameLinear(v, T),
      diagnose: () => 'Собери выражение по правилам темы: буквы с буквами, числа с числами, знак — отдельно.' });
  } else if (meta.kind === 'mono') {
    const T = parseMono(meta.fix).value;
    Object.assign(base, { parseAns: parseMono, same: v => sameMono(v, T),
      diagnose: () => 'Числа перемножь отдельно, буквы собери в степень — и сверь знак.' });
  } else if (meta.kind === 'eq') {
    const T = parseEq(meta.fix).value;
    Object.assign(base, { parseAns: parseEq, wide: true, same: v => sameEquation(v, T),
      diagnose: () => 'Каждое число при своей букве; «каждая тетрадь дороже» — это скобка.' });
  } else if (meta.kind === 'roots') {
    const T = parseRoots(meta.fix).value;
    Object.assign(base, { parseAns: parseRoots, same: v => Array.isArray(v) && v.length === 2 && eq(v[0], T[0]) && eq(v[1], T[1]),
      diagnose: () => 'У квадрата обычно два корня — не забудь отрицательный.' });
  } else if (meta.kind === 'interval') {
    const T = parseInterval(meta.fix).value;
    Object.assign(base, { parseAns: parseInterval, same: v => v === T,
      diagnose: () => 'Числа остаются те же — меняются только скобки: ≤ и <.' });
  }
  return base;
}
function oopsPool() {
  const pool = [];
  for (const m of MODULES) {
    if (!theoryDone(m)) continue;
    (m.oops || []).forEach((entry, i) => {
      const meta = OOPS_META[m.id] && OOPS_META[m.id][i];
      if (meta) pool.push({ mod: m, entry, meta });
    });
    for (const trap of OOPS_TRAPS[m.id] || []) pool.push({ mod: m, trap });
  }
  return pool;
}
function genOops() {
  const it = pick(oopsPool());
  if (it.trap)
    return { _mod: it.mod, q: oopsCard(it.trap[0]) + '<br>Петя прав?', options: ['прав', 'ошибся'], answer: 'прав',
      same: v => v === 'прав', solution: '<p><b>Да, здесь Петя прав.</b> ' + it.trap[1] + '</p>',
      diagnose: () => 'Не торопись: подставь число или посчитай шаг. Петя может быть и прав.' };
  return oopsAnswerTask(it.mod, it.entry[0], it.entry[1], it.meta);
}
function oopsCardHtml() {
  const n = oopsPool().length;
  const open = n ? '' : ' disabled';
  const icon = n ? '🔍' : '🔒 ';
  const note = n
    ? '5 чужих решений. Петя то ошибается — найди и исправь, то пишет верно — и это надо распознать. Подвох есть в обе стороны. Сеанс целиком +' + PTS.oops + '.'
    : 'Откроется с первой пройденной теории.';
  return '<button class="mod-btn oops" data-op="1"' + open + '><b>' + icon + 'Ошибки Пети</b><small>' + note + '</small></button>';
}
function startOops() {
  if (!oopsPool().length) return home();
  session = { mod: OOPS, okLeft: OOPS.size, okRight: 0 };
  nextTask();
}


function nextTask() {
  if (session.mod === MIX && session.mixLeft === 0) return mixSummary();
  if (session.mod === OOPS) {
    if (!session.okLeft) return oopsSummary();
    session.okLeft--;
    const t = genOops();
    Object.assign(session, { entry: null, seed: null, task: t, taskMod: t._mod,
      tries: 0, caught: false, finished: false, hints: 0, hintSteps: null, fails: 0 });
    return renderTask();
  }
  if (session.mod === JOURNAL) {
    if (session.pos >= session.entries.length) return journalSummary();
    const e = session.entries[session.pos++], m = MODULES.find(x => x.id === e.m);
    Object.assign(session, { entry: e, task: withSeed(e.seed, () => m.gen()), taskMod: m,
      tries: 0, caught: false, finished: false, hints: 0, hintSteps: null, fails: 0 });
    return renderTask();
  }
  // Mix draws only from topics whose theory is done: no tasks from a topic he has not opened yet.
  const m = session.mod === MIX ? pick(MODULES.filter(theoryDone)) : session.mod;
  const seed = (Math.random() * 4294967296) >>> 0;
  Object.assign(session, { entry: null, seed, task: withSeed(seed, () => m.gen()), taskMod: m,
    tries: 0, caught: false, finished: false, hints: 0, hintSteps: null, fails: 0 });
  renderTask();
}

function renderTask() {
  const { task, taskMod } = session;
  const s = st(taskMod.id);
  const isMix = session.mod === MIX, isJr = session.mod === JOURNAL, isOp = session.mod === OOPS;
  const scafs = scaffoldsOf(task);
  let num = 0;
  const mark = () => '①②③④⑤⑥'[num++];
  const multi = task.predict || scafs.length || task.check;
  app.innerHTML = `
    <div class="row between" style="margin-top:0">
      <button class="ghost" id="back">← Все темы</button>
      <span class="muted">${isMix ? `Перемешка: задача ${session.mixDone + 1} из ${MIX.size}` : isJr ? `📗 Ошибник: задача ${session.pos} из ${session.entries.length} · споткнулся ${session.entry.d0.slice(8)}.${session.entry.d0.slice(5, 7)}` : isOp ? `🔍 Ошибки Пети: задача ${OOPS.size - session.okLeft} из ${OOPS.size}` : `${taskMod.n}. ${taskMod.title}`}</span>
    </div>
    <div class="card">
      ${isMix || isJr || isOp ? '' : stages(taskMod, 2)}
      ${isMix || isJr || isOp ? '' : `<div class="streak">${[0, 1, 2, 3, 4].map(i => `<span class="${i < Math.min(s.streak, 5) ? 'on' : ''}"></span>`).join('')}</div>`}
      <div class="q">${task.q}${task.expr ? ' = ?' : ''}</div>
      ${task.predict ? `<div class="step"><div class="step-lbl">${mark()} ${task.predict.label}</div>
        <div class="choices">${task.predict.options.map(o => `<label><input type="radio" name="pred" value="${o}"><span>${o}</span></label>`).join('')}</div></div>` : ''}
      ${scafs.map((sc, j) => `<div class="step"><div class="step-lbl">${mark()} ${sc.label}</div>
        <input type="text" id="scaf${j}" autocomplete="off"${sc.wide ? ' style="width:320px"' : ''}></div>`).join('')}
      <div class="step"><div class="step-lbl">${multi ? mark() : ''} Ответ${task.formHint ? ` <span class="muted">(${task.formHint})</span>` : ''}:</div>
        ${task.options
          ? `<div class="choices">${task.options.map(o => `<label><input type="radio" name="ans" value="${o}"><span>${o}</span></label>`).join('')}</div>`
          : `<input type="text" id="ans" autocomplete="off"${task.wide ? ' style="width:320px"' : ''}>`}</div>
      ${task.check ? `<div class="step"><div class="step-lbl">${mark()} ${task.check.label}</div><input type="text" id="chk" autocomplete="off"></div>` : ''}
      <div class="row" id="buttons">
        <button class="main" data-conf="sure">Проверить — уверен</button>
        <button class="ghost" data-conf="doubt">Проверить — сомневаюсь</button>
      </div>
      <div id="feedback"></div>
      <div class="row" id="helprow"><button class="ghost help" id="help">🆘 Не знаю, как решать — покажи шаг</button><span class="think" id="stuck"></span></div>
      <div id="hintbox"></div>
    </div>`;
  document.getElementById('back').onclick = home;
  document.getElementById('help').onclick = showHint;
  if (!isMix && !isOp) wireStages(taskMod);
  app.querySelectorAll('[data-conf]').forEach(b => b.onclick = () => submit(b.dataset.conf));
  app.querySelectorAll('input[type=text]').forEach((inp, i, all) => inp.onkeydown = e => {
    if (e.key !== 'Enter') return;
    e.preventDefault();
    // Enter moves on but never submits: confidence must be a deliberate choice.
    if (all[i + 1]) all[i + 1].focus(); else app.querySelector('[data-conf]').focus();
  });
  const first = app.querySelector('input[type=text]');
  if (first && !task.predict) first.focus();
}

function feedback(kind, html, extra = '') {
  document.getElementById('feedback').innerHTML = `<div class="msg ${kind}">${html}</div>${extra}`;
  document.getElementById('buttons').hidden = session.finished;
  document.getElementById('helprow').hidden = session.finished;
  // Any unsuccessful press counts — a missing check or a wrong step blocks him as surely as a wrong answer.
  if (!session.finished && kind !== 'ok' && ++session.fails >= 3 && session.hints === 0) {
    document.getElementById('help').classList.add('pulse');
    document.getElementById('stuck').textContent = 'Застрял? Нажми 🆘 — разберём решение по шагам.';
  }
}

// Solution split into steps: every paragraph, and every line of a paragraph broken by <br>.
// A picture goes with the step before it.
function solutionSteps(html) {
  const box = document.createElement('div');
  box.innerHTML = html;
  const steps = [];
  for (const el of [...box.children]) {
    if (el.tagName === 'P') {
      const cls = el.className ? ` class="${el.className}"` : '';
      el.innerHTML.split(/<br\s*\/?>/i).map(s => s.trim()).filter(Boolean).forEach(s => steps.push(`<p${cls}>${s}</p>`));
    } else if (steps.length) steps[steps.length - 1] += el.outerHTML;
    else steps.push(el.outerHTML);
  }
  return steps.length ? steps : [html];
}

// "Не знаю, как решать": each press opens one more step of the solution. Once the whole
// solution has been read the task does not count, and he gets a similar one to do himself.
function showHint() {
  const { task, taskMod } = session;
  if (session.finished) return;
  const steps = session.hintSteps || (session.hintSteps = solutionSteps(task.solution));
  session.hints++;
  const help = document.getElementById('help'), box = document.getElementById('hintbox');
  help.classList.remove('pulse');
  document.getElementById('stuck').textContent = '';
  document.getElementById('feedback').innerHTML = '';
  box.innerHTML = `<div class="solution"><div class="step-lbl">Решаем по шагам — шаг ${session.hints} из ${steps.length}:</div>${steps.slice(0, session.hints).join('')}</div>`;
  if (session.hints < steps.length) {
    help.textContent = `🆘 Покажи следующий шаг (${session.hints + 1} из ${steps.length})`;
    box.insertAdjacentHTML('beforeend', '<p class="muted">Попробуй дальше сам. Не получается — открой ещё шаг.</p>');
    box.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    return;
  }
  const s = st(taskMod.id);
  session.finished = true;
  s.streak = 0;
  s.helped = (s.helped || 0) + 1;
  if (session.mod === MIX) { session.mixLeft--; session.mixDone++; }
  // A task he read off the screen is not his error to drill; a journal one just waits a day.
  if (session.entry) journalBack(session.entry);
  log(taskMod, task, '(разобрал с помощью)', '', false);
  save();
  document.getElementById('buttons').hidden = true;
  document.getElementById('helprow').hidden = true;
  box.insertAdjacentHTML('beforeend', `<div class="msg info">Теперь ты видел, как это решается. <b>Реши похожую сам</b> — так навык и появляется.</div>
    <div class="row"><button class="main" id="next">Реши похожую сам →</button></div>`);
  document.getElementById('next').onclick = nextTask;
  box.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}

function submit(conf) {
  if (session.finished) return;
  const { task, taskMod } = session;
  const s = st(taskMod.id);

  // 1. Everything filled in?
  const pred = app.querySelector('input[name=pred]:checked')?.value;
  if (task.predict && !pred) return feedback('warn', 'Сначала прикинь ответ — выбери вариант в пункте ①. Это и есть самопроверка.');
  const scafs = scaffoldsOf(task), first = task.predict ? 1 : 0;
  for (const [j, sc] of scafs.entries()) {
    const n = '①②③④⑤⑥'[first + j];
    const sp = (sc.parse || parse)(document.getElementById('scaf' + j).value);
    if (!sp) return feedback('warn', `Заполни пункт ${n} — это шаг к ответу.${sc.inputHint ? ' ' + sc.inputHint : ''}`);
    if (sc.reject && sc.reject(sp)) return feedback('warn', `Пункт ${n}: ${sc.reject(sp)}`);
    if (!stepRight(sc, sp.value)) return feedback('warn', `Пункт ${n} пока не так. ${sc.hint}`);
  }
  const typed = task.options ? app.querySelector('input[name=ans]:checked')?.value || '' : document.getElementById('ans').value.trim();
  const p = task.options ? (typed ? { value: typed, form: 'choice' } : null) : (task.parseAns || parse)(typed);
  if (!p && task.options) return feedback('warn', 'Выбери ответ.');
  if (!p) return feedback('warn', task.inputHint ||'Впиши ответ числом. Дробь — через косую черту (5/2), смешанное число — через пробел (1 3/4), десятичная — через запятую.');
  let chk = null;
  if (task.check) {
    chk = parse(document.getElementById('chk').value);
    if (!chk) return feedback('warn', `Сделай проверку — пункт ${'①②③④⑤⑥'[first + scafs.length + 1]}. Это самое важное в задаче.`);
  }

  // 2. Did his own check catch the mistake? That is a win, not a failed try.
  const selfCatch = msg => { session.caught = true; return feedback('info', `🕵️ <b>Стоп — ты сам себя поймал!</b> ${msg} Найди, где ошибка, и исправь.`); };
  // Consistency with his own estimate — independent of whether the estimate is right.
  if (task.predict && task.predict.ref === undefined && signWord(p.value) !== pred)
    return selfCatch(`Ты прикинул, что ответ будет ${pred}, а написал ${fmt(p.value)}. Что-то одно неверно.`);
  if (task.predict && task.predict.ref !== undefined && !eq(p.value, task.predict.ref)
      && (p.value > task.predict.ref ? 'больше' : 'меньше') !== pred)
    return selfCatch(`Ты прикинул, что ответ будет ${pred}, чем ${fmt(task.predict.ref)}, а написал ${fmt(p.value)}. Что-то одно неверно.`);
  if (task.check && task.check.targetOf) {
    // Equation check: he substitutes his x into the left side; the right side at his x is
    // the target. First make sure the substitution itself was counted right.
    const own = task.check.compute(p.value), other = task.check.targetOf(p.value);
    if (!eq(chk.value, own))
      return feedback('warn', `Посчитай проверку ещё раз: при x = ${fmt(p.value)} левая часть равна ${fmt(own)}, а не ${fmt(chk.value)}.`);
    if (!eq(own, other))
      return selfCatch(`Левая часть при x = ${fmt(p.value)} равна ${fmt(own)}, а правая — ${fmt(other)}. Не равны — значит, ${fmt(p.value)} не корень.`);
  } else if (task.check) {
    const own = task.check.compute ? task.check.compute(p.value) : null;
    // A letter that is not in the task has no value to substitute: say so instead of showing NaN.
    if (own !== null && !Number.isFinite(own))
      return feedback('warn', 'В ответе есть буква, которой нет в задаче. Пиши только те буквы, что в условии, латиницей.');
    // A slip in the check's own arithmetic is not a caught mistake: ask to recount first.
    if (own !== null && !eq(chk.value, own))
      return feedback('warn', task.parseAns
        ? `Посчитай проверку ещё раз: если подставить эти числа в твой ответ, получится ${fmt(round6(own))}, а не ${fmt(chk.value)}.`
        : `Посчитай проверку ещё раз: с твоим ответом ${fmt(p.value)} получается ${fmt(round6(own))}, а не ${fmt(chk.value)}.`);
    if (!eq(chk.value, task.check.target))
      return selfCatch(`Проверка дала ${fmt(chk.value)}, а должно получиться ${fmt(task.check.target)}.`);
  }

  // 3. Grade.
  const valueRight = task.same ? task.same(p.value) : eq(p.value, task.answer);
  const right = valueRight && (!task.form || p.form === task.form);
  const rightValueWrongForm = valueRight && task.form && p.form !== task.form;
  if (rightValueWrongForm) return feedback('warn', `Значение верное, но запиши в нужном виде. ${task.formHint}`);
  const formMsg = valueRight && task.formOk ? task.formOk(p) : null;
  if (formMsg) return feedback('warn', formMsg);
  const predWrong = task.predict && pred !== task.predict.correct;

  session.tries++;
  if (conf === 'sure') { s.sure++; if (!right) s.sureWrong++; }
  log(taskMod, task, typed, conf, right);

  if (right) {
    session.finished = true;
    s.solved++;
    // Solved after looking at hints: counts as solved, but not as "on his own" — the streak restarts.
    const alone = session.tries === 1 && !session.hints;
    // Only crossing a block of five earns: a streak carried from yesterday must not pay out
    // again the next day after a single correct answer.
    if (alone) { s.firstTry++; s.streak++; if (s.streak % 5 === 0) s.series = (s.series || 0) + 1; } else s.streak = 0;
    if (session.hints) s.helped = (s.helped || 0) + 1;
    if (session.caught) s.selfCaught++;
    // Journal: a review counts only as a clean first try; a first-try answer he himself
    // doubted comes back too, just later — certainty, not luck, closes a gap.
    if (session.entry) { if (alone) journalPass(session.entry); else journalBack(session.entry); }
    else if (session.tries === 1 && conf === 'doubt' && !session.hints) journalAdd(taskMod.id, session.seed, 'guess');
    let newly = false;
    if (s.streak >= 5 && !s.mastered.includes(today())) { s.mastered.push(today()); newly = true; }
    if (session.mod === MIX) { session.mixLeft--; session.mixDone++; if (alone) session.mixRight++; }
    if (session.mod === OOPS && alone) session.okRight++;
    save();
    feedback('ok', `<b>Верно!</b> ${session.caught ? 'И ошибку ты нашёл сам — так и надо.' : ''}
      ${predWrong ? `<br>А вот прикидка была неточной: правильно «${task.predict.correct}». Подумай, почему.` : ''}
      ${newly ? '<br>🎉 <b>5 подряд — тема на сегодня освоена!</b> Можно перейти к другой теме или к «Перемешке».' : ''}`,
      `<div class="solution"><div class="step-lbl">Сравни со своим решением:</div>${task.solution}</div>
       <div class="row"><button class="main" id="next">Следующая →</button></div>`);
    document.getElementById('next').onclick = nextTask;
    // No focus on "next": an Enter pressed out of habit would skip the solution unread.
    return;
  }

  s.streak = 0;
  // With only two options a second try is a coin flip, not a fix — show the solution at once.
  const binary = task.options && task.options.length === 2;
  if (session.tries === 1 && !binary) {
    save();
    const why = task.diagnose(p.value, p);
    return feedback('bad', `<b>Пока неверно.</b> ${why}${conf === 'sure' ? '<br><span class="muted">Ты был уверен — запомни, какая проверка поймала бы эту ошибку.</span>' : ''}<br>Попробуй ещё раз.`);
  }
  session.finished = true;
  if (session.mod === MIX) { session.mixLeft--; session.mixDone++; }
  if (session.entry) journalBack(session.entry); else journalAdd(taskMod.id, session.seed, 'fail');
  save();
  feedback('bad', binary ? '<b>Неверно. Разберём:</b>' : '<b>Разберём решение.</b>',
    `<div class="solution">${task.solution}</div>
     <div class="row"><button class="main" id="next">Следующая →</button></div>`);
  document.getElementById('next').onclick = nextTask;
}

// `typed` is kept as written: "4/2" and "2" are the same number but different mistakes.
function log(mod, task, typed, conf, right) {
  if (right) dayRec().n++;
  store.log.push({ d: stamp(), m: mod.id,
    q: task.q.replace(/<span class="fr"><span>(.*?)<\/span><span>(.*?)<\/span><\/span>/g, ' $1/$2').replace(/<sup>(.*?)<\/sup>/g, '^$1').replace(/<[^>]+>/g, '').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&nbsp;/g, ' ').replace(/\s+/g, ' ').trim(),
    a: typed, c: conf, ok: right, t: session.tries });
  if (store.log.length > 400) store.log.splice(0, store.log.length - 400);
}

function mixSummary() {
  store.mixesDone++; save();
  app.innerHTML = `<div class="card" style="text-align:center">
    <h2>Перемешка готова</h2>
    <p>С первой попытки: <b>${session.mixRight} из ${MIX.size}</b>.</p>
    <div class="row" style="justify-content:center"><button class="main" id="home">К темам</button>
      <button class="ghost" id="again">Ещё раз</button></div></div>`;
  document.getElementById('home').onclick = home;
  document.getElementById('again').onclick = startMix;
}

function journalSummary() {
  const es = session.entries;
  const gone = es.filter(e => !store.queue.includes(e)).length;

    <div class="row" style="justify-content:center"><button class="main" id="home">К темам</button></div></div>`;
  document.getElementById('home').onclick = home;
}

function oopsSummary() {

  app.innerHTML = '<div class="card" style="text-align:center">' +
    '<h2>🔍 Сеанс Пети разобран</h2>' +
    '<p>Верных разборов с первой попытки: <b>' + session.okRight + ' из ' + OOPS.size + '</b> · +' + PTS.oops + ' очк. за сеанс.</p>' +
    '<p class="muted">Главное не счёт, а привычка смотреть на чужое решение и находить слабое место — она же ловит ошибки на контрольной.</p>' +
    '<div class="row" style="justify-content:center"><button class="main" id="home">К темам</button>' +
    '<button class="ghost" id="again">Ещё сеанс</button></div></div>';

function resultsText() {
  const lines = [`Тренажёр, ${stamp().replace('T', ' ')}`,
    `очки ${points()} · решено сегодня ${dayN()} · дней подряд ${dayStreak()} · в тренажёре ${hm(secsTotal())}${store.queue.length || store.journalOut ? ` · ошибник: в очереди ${store.queue.length}, на сегодня ${dueEntries().length}, закрыто ${store.journalOut}${store.oopsDone ? `, сеансов Пети ${store.oopsDone}` : ''}` : ''}`, ''];
  for (const m of MODULES) {
    const s = st(m.id);
    if (!s.solved && !s.sure) continue;
    lines.push(`${m.short}: решено ${s.solved}, с 1-й попытки ${s.firstTry}, уверен-но-неверно ${s.sureWrong}/${s.sure}, сам поймал ${s.selfCaught}, брал помощь ${s.helped || 0}, освоено: ${s.mastered.join(', ') || '—'}`);
  }
  const errs = store.log.filter(e => !e.ok).slice(-20);
  if (errs.length) {
    lines.push('', 'Последние ошибки:');
    for (const e of errs) lines.push(`${e.d.slice(5, 10)} ${MODULES.find(m => m.id === e.m)?.short}: ${e.q} → ${e.a}${e.c === 'sure' ? ' (уверен)' : ''}`);
  }
  return lines.join('\n');
}

function copyText(btn, text, done) {
  const fallback = () => {
    document.getElementById('copy-box')?.remove();
    app.insertAdjacentHTML('beforeend', `<div class="card" id="copy-box"><p>Выдели весь текст (Ctrl+A), скопируй и отправь сообщением.</p>
      <textarea>${esc(text)}</textarea></div>`);
    const t = document.querySelector('#copy-box textarea'); t.focus(); t.select(); t.scrollIntoView();
  };
  if (navigator.clipboard && window.isSecureContext)
    navigator.clipboard.writeText(text).then(() => { btn.textContent = done; }).catch(fallback);
  else fallback();
}
const copyResults = btn => copyText(btn, resultsText(), 'Скопировано ✓ — вставь в сообщение');

// ---------- backup ----------
// Progress lives in one browser, and the messenger passes text but not files, so the way
// out of losing it is a string kept in notes. The task-text log stays out: it is the bulk
// of the blob and it holds the child's written answers.
const BACKUP_V = 1;
const cksum = s => { let h = 2166136261; for (let i = 0; i < s.length; i++) h = ((h * 33) ^ s.charCodeAt(i)) >>> 0; return h.toString(36); };
const backupText = () => {
  const j = JSON.stringify({ b: BACKUP_V, grade: store.grade, stats: store.stats, lessons: store.lessons,
    days: store.days, mixesDone: store.mixesDone, queue: store.queue, journalOut: store.journalOut, oopsDone: store.oopsDone });
  return `algebra7-backup ${cksum(j)} ${j}`;
};
function parseBackup(txt) {
  const a = txt.indexOf('{'), b = txt.lastIndexOf('}');
  if (a < 0 || b <= a) return { err: 'Не нашёл сами данные. Вставь строку целиком — от «algebra7-backup» до последней скобки.' };
  const body = txt.slice(a, b + 1).replace(/\s+/g, ''), head = txt.slice(0, a).trim().split(/\s+/);
  if (head[0] !== 'algebra7-backup') return { err: 'Это не бэкап тренажёра: нет метки algebra7-backup.' };
  if (body.length > 200000) return { err: 'Слишком длинная строка — похоже, скопировалось лишнее.' };
  // Checked before parsing: a paste truncated in transit must be named as such, not as "wrong format".
  if (head[head.length - 1] !== cksum(body)) return { err: 'Строка повреждена при копировании. Скопируй заново всё, включая первые два слова.' };
  let o; try { o = JSON.parse(body); } catch { return { err: 'Данные не читаются — попробуй вставить заново.' }; }
  const obj = x => !!x && typeof x === 'object' && !Array.isArray(x);
  if (o.b !== BACKUP_V || !obj(o.stats) || !obj(o.lessons) || !obj(o.days)) return { err: 'Формат бэкапа не подходит этой версии тренажёра.' };
  return { o };
}
const bkMsg = (text, cls) => {
  document.getElementById('bkmsg')?.remove();
  document.getElementById('bpaste').insertAdjacentHTML('afterend', `<div class="msg ${cls}" id="bkmsg">${text}</div>`);
};
function restoreFromPaste() {
  const box = document.getElementById('bpaste'), p = parseBackup(box.value);
  if (p.err) { box.focus(); return bkMsg(p.err, 'bad'); }
  // Normalized before the preview: what the parent confirms must be what gets applied.
  const o = normalizeStore({ ...p.o });
  const cur = [points(), Object.keys(store.lessons).length, Object.keys(store.days).length];
  const nxt = [points(o), Object.keys(o.lessons).length, Object.keys(o.days).length];
  if (!confirm(`Заменить текущий прогресс бэкапом?\n\nСейчас:   очки ${cur[0]}, теорий ${cur[1]}, дат ${cur[2]}\nВ бэкапе: очки ${nxt[0]}, теорий ${nxt[1]}, дат ${nxt[2]}\n\nОтменить — только вставив строку более раннего бэкапа.`)) return;
  // The error log is not part of the backup, so the old device's list goes with the progress it belongs to.
  store = { ...store, ...o, log: [] };
  normalizeStore(); save(); home();
  document.querySelector('#app .card')?.insertAdjacentHTML('beforeend',
    `<div class="msg ok">Бэкап восстановлен: очки <b>${points()}</b>, теорий <b>${Object.keys(store.lessons).length}</b>, дат <b>${Object.keys(store.days).length}</b>. Список последних ошибок очищен — текстов задач в бэкапе нет.</div>`);
}

home();
</script>
</body>
